<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Book Crawl</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128218;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F2F1F7; --surface:#FFFFFF; --surface2:#E9E7F2; --ink:#26223A; --ink2:#5A5570;
  --muted:#8B86A0; --accent:#8A5E14; --accent-strong:#E8A33D; --accent-soft:#F7E9CE;
  --violet:#4C3D8F; --violet-soft:#E4E0F5; --good:#1E7A46; --good-soft:#D9F0E2;
  --warn:#A85B12; --warn-soft:#FBE8CF; --bad:#B3352E; --line:#D8D5E6; --shadow:0 2px 10px rgba(38,34,58,.10);
  --t-common-bg:#E5E3EC; --t-common-ink:#4A4660;
  --t-uncommon-bg:#D3EDDC; --t-uncommon-ink:#1E6B40;
  --t-rare-bg:#D6E6F7; --t-rare-ink:#215B8F;
  --t-epic-bg:#E4DAF5; --t-epic-ink:#5B3E9E;
  --t-legendary-bg:#F7E3B5; --t-legendary-ink:#7A5A10;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17142A; --surface:#221D3E; --surface2:#2C2650; --ink:#EFEDF8; --ink2:#B9B3D1;
    --muted:#837DA1; --accent:#F0B75B; --accent-strong:#E8A33D; --accent-soft:#3A3050;
    --violet:#A79BE0; --violet-soft:#322B58; --good:#63C98C; --good-soft:#1F4633;
    --warn:#F0A254; --warn-soft:#4A3418; --bad:#F08A84; --line:#3A3463; --shadow:0 2px 12px rgba(0,0,0,.35);
    --t-common-bg:#37325A; --t-common-ink:#C9C4DD;
    --t-uncommon-bg:#1F4633; --t-uncommon-ink:#8FE0B0;
    --t-rare-bg:#1F3A57; --t-rare-ink:#9CC8F0;
    --t-epic-bg:#3C2E63; --t-epic-ink:#C9B5F0;
    --t-legendary-bg:#574314; --t-legendary-ink:#F5CF7E;
  }
}
:root[data-theme="dark"]{
  --bg:#17142A; --surface:#221D3E; --surface2:#2C2650; --ink:#EFEDF8; --ink2:#B9B3D1;
  --muted:#837DA1; --accent:#F0B75B; --accent-strong:#E8A33D; --accent-soft:#3A3050;
  --violet:#A79BE0; --violet-soft:#322B58; --good:#63C98C; --good-soft:#1F4633;
  --warn:#F0A254; --warn-soft:#4A3418; --bad:#F08A84; --line:#3A3463; --shadow:0 2px 12px rgba(0,0,0,.35);
  --t-common-bg:#37325A; --t-common-ink:#C9C4DD;
  --t-uncommon-bg:#1F4633; --t-uncommon-ink:#8FE0B0;
  --t-rare-bg:#1F3A57; --t-rare-ink:#9CC8F0;
  --t-epic-bg:#3C2E63; --t-epic-ink:#C9B5F0;
  --t-legendary-bg:#574314; --t-legendary-ink:#F5CF7E;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:16px; line-height:1.45;
}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent-strong); outline-offset:1px}
.display{font-family:"Bungee","Arial Black",system-ui,sans-serif; font-weight:400; letter-spacing:.02em}
.app{max-width:980px; margin:0 auto; padding:14px 14px 90px}
.hidden{display:none !important}

/* top bar */
.topbar{display:flex; align-items:center; gap:10px; padding:10px 2px 14px}
.topbar .brand{font-size:clamp(19px,4vw,26px); color:var(--violet)}
.topbar .brand small{display:block; font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.topbar .spacer{flex:1}
.iconbtn{width:44px; height:44px; border-radius:12px; background:var(--surface); box-shadow:var(--shadow); display:grid; place-items:center; font-size:19px; color:var(--ink2)}
.pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 12px; font-weight:700; font-size:14px}

/* cards & layout */
.card{background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:16px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}
h2{font-size:17px; margin-bottom:8px}
.label{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700}
.mut{color:var(--ink2)} .tiny{font-size:13px; color:var(--muted)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:14px; font-weight:700; background:var(--surface2); color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--violet); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#171430}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{color:#171430} }
.btn.gold{background:var(--accent-strong); color:#2E2205; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.big{width:100%; min-height:62px; font-size:19px}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink2)}
.btn.small{min-height:38px; padding:6px 14px; border-radius:10px; font-size:14px}
.btn.good{background:var(--good); color:#fff}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn:disabled{opacity:.45; cursor:default}

/* name grid (login) */
.gate{max-width:560px; margin:0 auto; text-align:center; padding-top:4vh}
.gate .brand{font-size:clamp(30px,8vw,52px); color:var(--violet); text-shadow:0 3px 0 var(--accent-soft)}
.gate .sub{color:var(--ink2); margin:6px 0 22px}
.namegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; text-align:center}
.namecard{background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:14px 8px; font-weight:700; font-size:17px; display:flex; flex-direction:column; gap:6px; align-items:center}
.namecard:hover{transform:translateY(-2px)}
.avatar{width:44px; height:44px; border-radius:50%; background:var(--violet-soft); color:var(--violet); display:grid; place-items:center; font-weight:700}
/* pin pad */
.pinpad{max-width:300px; margin:0 auto}
.pindots{display:flex; gap:12px; justify-content:center; margin:16px 0}
.pindots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--muted)}
.pindots span.full{background:var(--accent-strong); border-color:var(--accent-strong)}
.padgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.padgrid .btn{min-height:58px; font-size:22px}
.shake{animation:shake .35s} @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* student home */
.hero{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,var(--violet) 0%, #6A55B8 100%); color:#fff; border-radius:18px; padding:18px; box-shadow:var(--shadow)}
.hero .who{flex:1; min-width:0}
.hero .who .nm{font-size:20px; font-weight:700}
.hero .who .lvl{font-size:13px; opacity:.9}
.hero .pts{text-align:right}
.hero .pts .n{font-family:"Bungee","Arial Black",sans-serif; font-size:34px; line-height:1; color:var(--accent-strong); text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hero .pts .l{font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.85}
.lootbanner{background:var(--accent-strong); color:#2E2205; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:12px; font-weight:700; box-shadow:var(--shadow)}
.lootbanner .chest{font-size:30px; animation:bounce 1.6s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
.progressbar{height:12px; border-radius:999px; background:var(--surface2); overflow:hidden}
.progressbar>i{display:block; height:100%; border-radius:999px; background:var(--accent-strong); min-width:4px}
/* read list */
.readrow{display:flex; gap:10px; align-items:center; padding:10px 2px; border-top:1px solid var(--line)}
.readrow:first-of-type{border-top:none}
.readrow .bk{flex:1; min-width:0}
.readrow .bk .t{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.readrow .bk .d{font-size:13px; color:var(--muted)}
.chip{border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:700; white-space:nowrap}
.chip.pend{background:var(--warn-soft); color:var(--warn)}
.chip.ver{background:var(--good-soft); color:var(--good)}
.chip.lvlwait{background:var(--violet-soft); color:var(--violet)}
.chip.common{background:var(--t-common-bg); color:var(--t-common-ink)}
.chip.uncommon{background:var(--t-uncommon-bg); color:var(--t-uncommon-ink)}
.chip.rare{background:var(--t-rare-bg); color:var(--t-rare-ink)}
.chip.epic{background:var(--t-epic-bg); color:var(--t-epic-ink)}
.chip.legendary{background:var(--t-legendary-bg); color:var(--t-legendary-ink)}
.ptbadge{font-family:"Bungee","Arial Black",sans-serif; font-size:17px; color:var(--accent); min-width:44px; text-align:right}

/* log-a-book */
.suggest{position:relative}
.suggest .list{position:absolute; z-index:30; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:260px; overflow:auto}
.suggest .list button{display:block; width:100%; text-align:left; padding:10px 12px; border-top:1px solid var(--line)}
.suggest .list button:first-child{border-top:none}
.suggest .list button:hover{background:var(--surface2)}
.fieldlbl{font-weight:700; font-size:14px; margin:10px 0 4px}

/* loot reveal overlay */
.overlay{position:fixed; inset:0; background:rgba(18,14,40,.86); display:grid; place-items:center; z-index:100; padding:20px}
/* 📷 scan-a-book */
.scanbox{width:min(94vw,520px);max-height:92vh;overflow-y:auto;background:#1D1740;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#scanvid{width:100%;max-height:44vh;border-radius:12px;background:#000;object-fit:cover}
.scancover{height:86px;border-radius:6px;float:right;margin:0 0 8px 10px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scanbox .card{background:var(--card,#fff)}
.lexcard{width:min(94vw,580px);max-height:88vh;overflow-y:auto}
.writein{display:inline-block;min-width:150px;border-bottom:1.5px solid #8A84B0;height:1em}
.lexsel{min-width:150px}
.lootstage{text-align:center; color:#fff; max-width:420px; width:100%}
.chestbig{font-size:110px; display:inline-block}
.chestbig.rumble{animation:rumble 1.1s ease-in-out}
@keyframes rumble{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg) scale(1.03)}30%{transform:rotate(7deg)}45%{transform:rotate(-6deg) scale(1.06)}60%{transform:rotate(5deg)}75%{transform:rotate(-3deg) scale(1.1)}}
.tiercard{border-radius:20px; padding:26px 20px; margin-top:14px; animation:pop .45s}
@keyframes pop{0%{transform:scale(.6); opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.tiercard .tn{font-family:"Bungee","Arial Black",sans-serif; font-size:34px}
.tiercard .roll{font-size:14px; opacity:.8; margin-top:4px}
.tiercard .hint{margin-top:10px; font-weight:700}

/* teacher */
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px}
.tabs .btn{min-height:42px; padding:8px 16px; border-radius:999px; white-space:nowrap}
.tabs .btn.on{background:var(--violet); color:#fff}
:root[data-theme="dark"] .tabs .btn.on{color:#171430}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabs .btn.on{color:#171430} }
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 8px; border-bottom:2px solid var(--line); white-space:nowrap}
td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:hover td{background:var(--surface2)}
.tablewrap{overflow-x:auto}
.num{text-align:right} th.num{text-align:right}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px}
.stat{background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px}
.stat .n{font-family:"Bungee","Arial Black",sans-serif; font-size:26px; color:var(--violet)}
.stat .l{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.05em; text-transform:uppercase}
.qcard{border:1.5px solid var(--line); border-radius:14px; padding:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.qcard .info{flex:1; min-width:180px}
.inline-lvl{width:90px; text-align:center}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px; font-weight:700; z-index:200; box-shadow:var(--shadow)}
.banner{background:var(--violet-soft); color:var(--violet); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700}
.footer-note{margin-top:26px; text-align:center; font-size:12.5px; color:var(--muted)}
textarea.paste{width:100%; min-height:120px; font-size:14px}
.settingrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.settingrow label{flex:1; min-width:200px; font-weight:700; font-size:14.5px}
.settingrow input{width:110px; text-align:center}
.settingrow .hint{flex-basis:100%; font-size:12.5px; color:var(--muted); margin-top:-4px}

/* ---- production additions ---- */
.codegate input{font-size:26px;text-align:center;letter-spacing:.35em;text-transform:uppercase;width:230px;font-weight:700}
.teachdoor{margin-top:38px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.teachdoor .tdsep{color:var(--muted);opacity:.6}
.authform{max-width:380px;margin:0 auto;text-align:left}
.authform input{width:100%;margin-top:4px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-pill{position:fixed;top:8px;right:8px;z-index:60;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}

/* ---- dungeon backdrop ---- */
#dungeonbg{position:fixed;inset:0;z-index:-2;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#dungeonglow{position:fixed;inset:0;z-index:-1;pointer-events:none;animation:torchpulse 4.5s ease-in-out infinite}
@keyframes torchpulse{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){ #dungeonglow{animation:none} }
.card,.namecard,.stat,.hero,.qcard{backdrop-filter:none}

/* ---- juice ---- */
.avatarimg{width:44px;height:44px;border-radius:10px;image-rendering:pixelated;background:var(--surface2)}
.hero .avatarimg{width:54px;height:54px;border-radius:12px;flex:none}
.pcard .avatarimg{width:40px;height:40px;float:right}
.progressbar>i{position:relative;overflow:hidden}
.progressbar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:shine 3.2s infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){ .progressbar>i::after{animation:none;display:none} }
.overlay .fx{position:fixed;inset:0;pointer-events:none}
.overlay.flashin{animation:flashin .6s ease-out}
@keyframes flashin{0%{background:rgba(255,248,220,.95)}100%{background:rgba(18,14,40,.86)}}
.overlay.shakehard{animation:shakehard .55s ease-in-out}
@keyframes shakehard{0%,100%{transform:translate(0,0)}12%{transform:translate(-9px,4px)}25%{transform:translate(8px,-5px)}38%{transform:translate(-7px,-3px)}50%{transform:translate(6px,5px)}65%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.chestbig.rumble2{animation:rumble2 2s ease-in-out}
@keyframes rumble2{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg) scale(1.03)}30%{transform:rotate(-8deg)}40%{transform:rotate(8deg) scale(1.06)}50%{transform:rotate(-10deg) scale(1.1)}62%{transform:rotate(10deg) scale(1.14)}75%{transform:rotate(-12deg) scale(1.2)}88%{transform:rotate(9deg) scale(1.28)}}
.tiercard.big .tn{font-size:44px;letter-spacing:.04em}
.tiercard .flavor{margin-top:8px;font-style:italic;opacity:.85}
.floorbanner{text-align:center;color:#fff}
.floorbanner .f1{font-family:"Bungee","Arial Black",sans-serif;font-size:20px;opacity:.85}
.floorbanner .f2{font-family:"Bungee","Arial Black",sans-serif;font-size:clamp(30px,7vw,54px);color:var(--accent-strong);text-shadow:0 3px 0 rgba(0,0,0,.35);animation:pop .5s}

/* ---- year-end vault ---- */
.yt{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;margin-top:8px;border:1.5px solid var(--line);background:var(--surface2)}
.yt .ico{font-size:20px;width:26px;text-align:center}
.yt .mid{flex:1;min-width:0}
.yt .nm{font-weight:700;font-size:14.5px}
.yt .sub{font-size:12px;color:var(--muted)}
.yt.locked{opacity:.5}
.yt.earned{border-width:2px}
.yt.yt0.earned{background:#EAD5C0;border-color:#B98554;color:#5C3A1A}
.yt.yt1.earned{background:#E8E8EE;border-color:#9C9CB0;color:#3C3C50}
.yt.yt2.earned{background:var(--t-legendary-bg);border-color:#C9A23F;color:var(--t-legendary-ink)}
.yt.yt3.earned{background:#DDF0EE;border-color:#5FB8B4;color:#1F5C58}
.yt.yt4{background:linear-gradient(120deg,#161040,#2A1E5C 55%,#173A4E);border-color:#7FE3E0;color:#C9F5F2}
.yt.yt4 .sub{color:#8FD3D0}
.yt.yt4.earned{box-shadow:0 0 14px rgba(127,227,224,.5)}
.yt .prog{height:8px;border-radius:999px;background:rgba(127,127,127,.25);overflow:hidden;margin-top:5px}
.yt .prog i{display:block;height:100%;background:var(--accent-strong);border-radius:999px;min-width:3px}

/* ---- ceremony ---- */
.ceremony{position:fixed;inset:0;z-index:300;background:rgba(10,7,26,.97);display:grid;place-items:center;padding:20px;color:#EFEDF8}
.cerewrap{text-align:center;max-width:640px;width:100%}
.cerekicker{font-family:"Bungee","Arial Black",sans-serif;font-size:16px;letter-spacing:.12em;color:#8FD3D0;opacity:.9}
.cerename{font-family:"Bungee","Arial Black",sans-serif;font-size:clamp(30px,6vw,52px);color:#F5CF7E;text-shadow:0 4px 0 rgba(0,0,0,.4);margin:8px 0 2px}
.cereav{width:110px;height:110px;border-radius:22px;image-rendering:pixelated;background:#241D44;box-shadow:0 6px 24px rgba(0,0,0,.5);margin-bottom:6px;animation:pop .5s}
.cerestats{font-size:16px;color:#B9B3D1;margin:6px 0 14px}
.cerebox{display:inline-block;border-radius:18px;padding:16px 30px;font-family:"Bungee","Arial Black",sans-serif;font-size:clamp(20px,4vw,32px);animation:pop .55s}
.cerebox.none{background:#2C2650;color:#B9B3D1;font-size:20px}
.cerebox.yt0{background:#EAD5C0;color:#5C3A1A}
.cerebox.yt1{background:#E8E8EE;color:#3C3C50}
.cerebox.yt2{background:#F7E3B5;color:#7A5A10}
.cerebox.yt3{background:#DDF0EE;color:#1F5C58}
.cerebox.yt4{background:linear-gradient(120deg,#161040,#2A1E5C 55%,#173A4E);color:#B9F0EE;box-shadow:0 0 40px rgba(127,227,224,.65)}
.cerectl{margin-top:26px;display:flex;gap:10px;justify-content:center}
.cerecount{position:fixed;top:14px;right:18px;font-size:13px;color:#837DA1}
@keyframes cosmic{0%,100%{box-shadow:0 0 40px rgba(127,227,224,.65)}50%{box-shadow:0 0 90px rgba(127,227,224,.95)}}
.cerebox.yt4.pulse{animation:cosmic 2.4s ease-in-out infinite}

/* ---- gear / character ---- */
.charav{width:128px;height:128px;border-radius:20px;image-rendering:pixelated;background:var(--surface2);box-shadow:var(--shadow)}
.slotrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.slotrow:first-of-type{border-top:none}
.slotlbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;width:88px}
.gearchip{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer}
.gearchip.on{outline:2.5px solid var(--accent-strong)}
.gearchip.rar-Common{background:var(--t-common-bg);color:var(--t-common-ink);border-color:transparent}
.gearchip.rar-Uncommon{background:var(--t-uncommon-bg);color:var(--t-uncommon-ink);border-color:transparent}
.gearchip.rar-Rare{background:var(--t-rare-bg);color:var(--t-rare-ink);border-color:transparent}
.gearchip.rar-Epic{background:var(--t-epic-bg);color:var(--t-epic-ink);border-color:transparent}
.gearchip.rar-Legendary{background:var(--t-legendary-bg);color:var(--t-legendary-ink);border-color:transparent}
.newgear{margin-top:10px;font-weight:700;animation:pop .5s}
.newgear .chip{font-size:14px;padding:5px 12px}
/* quest reports + spot checks */
.questcard{margin-top:14px;padding:12px;border:1.5px dashed var(--violet);border-radius:12px;background:var(--surface2)}
.questcard .questq{font-weight:700;margin:2px 0 8px}
.questcard textarea{width:100%;min-height:64px;resize:vertical}
.qanswer{margin-top:6px;padding:8px 10px;border-left:3px solid var(--violet);background:var(--surface2);border-radius:0 8px 8px 0;font-size:14px}
.chip.spotchk{background:var(--warn);color:#241a04;border:none;font-weight:800}
.qcard.flagged{border:1.5px solid var(--warn)}
.aiv{margin-top:6px;font-size:13px;font-weight:700}
.aiv-ok{color:var(--good, #2E7D32)}
.aiv-mismatch{color:var(--warn)}
.aiv-unsure{color:var(--muted)}
.peers{margin-top:6px;font-size:13px}
.peers summary{cursor:pointer;color:var(--violet);font-weight:700}
.peers .peer{margin:6px 0 0 12px;padding-left:8px;border-left:2px solid var(--line)}
.toast .undobtn{margin-left:12px;background:var(--accent-strong);color:#241a04;border:none;border-radius:8px;padding:4px 12px;font-weight:800;font-size:13px;cursor:pointer}
/* the Descent map */
.descwrap{position:relative;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 4px 18px rgba(20,14,50,.18)}
#descmap{display:block;width:100%;height:auto;image-rendering:pixelated}
.desclabels{position:absolute;inset:0;display:grid;grid-template-rows:repeat(15,16fr) 12fr}
.descrow{display:flex;align-items:center;padding:0 8px;gap:8px;overflow:hidden;min-height:0}
.descrow .fl{background:rgba(10,8,24,.58);color:#F5F2FF;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;flex-shrink:0}
.descrow.lk .fl{opacity:.75}
.descrow.mine .fl{box-shadow:0 0 0 1.5px var(--accent-strong)}
.davs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dav{position:relative;display:inline-block;line-height:0}
.dav .avatarimg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.dav.meav .avatarimg{width:27px;height:27px;outline:2px solid var(--accent-strong);outline-offset:1px;border-radius:4px;background:rgba(0,0,0,.28);animation:meglow 1.6s ease-in-out infinite}
.dav.meav{margin:0 4px}
.youtag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#F5CF7E;letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,0,0,.8)}
@keyframes meglow{0%,100%{outline-color:var(--accent-strong)}50%{outline-color:#F5CF7E}}
.tour .tstep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.tour .tstep.done{opacity:.68}
.tickbox{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:14px}
.tmid{flex:1;min-width:0}
.linkbtn{background:none;border:none;padding:0;margin:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-size:inherit}
.chip.reread{background:#F7E9CE;color:#8A5E14;border:1px solid #E8A33D}
.rc{margin-top:6px}
.rc summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700}
.rc textarea{width:100%;margin:6px 0;font-size:14px;box-sizing:border-box}
.bounty{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.bounty:last-child{border-bottom:none}
.bounty .bicon{font-size:22px}
.bounty .binfo{flex:1}
.bounty.done{opacity:.72}
.torchrow{display:flex;align-items:center;gap:12px}
.clsswitch{padding:6px 10px;border-radius:10px;font-size:14px;font-weight:700;max-width:180px}
.torchrow .avatarimg{width:44px;height:44px}
.floorbanner .f3{font-size:14px;font-style:italic;opacity:.85;margin-top:8px}
.hero .title-line{font-size:12px;opacity:.85;font-style:italic}
#printcards{display:none}
@media print{
  body *{visibility:hidden} #printcards, #printcards *{visibility:visible}
  #printcards{display:grid !important;position:absolute;inset:0;grid-template-columns:1fr 1fr;gap:14px;padding:10mm;background:#fff;color:#000}
  .pcard{border:2px dashed #999;border-radius:10px;padding:14px;page-break-inside:avoid;font-family:Arial,sans-serif}
  .pcard .nm{font-size:20px;font-weight:700}
  .pcard .row2{font-size:14px;margin-top:6px}
}
</style>

<script>
"use strict";
/* ============================================================
   BOOK CRAWL — production app
   Storage: Supabase (live) or in-browser demo mode (?demo=1,
   or automatically when CONFIG is unset).
   ============================================================ */
const CONFIG = {
  url:  "https://zajzxapfllkcnxrelrph.supabase.co",
  anon: "sb_publishable_iHLNit_D3KIAFqEZ-EWtbw_5fa5MsYG"
};
const DEMO = /[?&]demo=1/.test(location.search) || !/^https?:/.test(CONFIG.url);

/* ---------------- scoring engine (identical to workbook + demo) ---------------- */
const Engine = {
  levelAt(student, dateISO){
    const entries = (student.levels||[]).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    let lvl = null;
    for(const e of entries){ if(e.date <= dateISO) lvl = e.lvl; }
    if(lvl === null && entries.length) lvl = entries[0].lvl;
    return lvl;
  },
  lengthBonus(pages, s){
    if(!pages) return 0;
    for(const b of s.lenBands.slice().sort((a,b)=>b.min-a.min)){ if(pages >= b.min) return b.pts; }
    return 0;
  },
  score(read, book, student, s){
    if(!book || book.level == null) return {state:"needsLevel", pts:0};
    const lvl = this.levelAt(student, read.date);
    if(lvl == null) return {state:"needsStudentLevel", pts:0};
    const stretch = book.level - lvl;
    let base;
    if(stretch < -s.belowCutoff) base = s.fluencyPts;
    else base = s.basePts + (stretch > 0 ? Math.round(Math.min(stretch, s.stretchCap)/10) * s.per10L : 0);
    const len = this.lengthBonus(read.gn ? Math.round((book.pages||0)/3) : book.pages, s);
    const total = base + len;
    const rank = stretch >= 200 ? "EPIC stretch" : stretch >= 100 ? "Rare stretch" :
                 stretch >= 1 ? "Uncommon stretch" : stretch >= -s.belowCutoff ? "On-level" : "Fluency";
    return {state:"ok", stretch, base, len, total, rank, pts: read.status === "verified" ? total : 0};
  },
  totals(studentId, D){
    const student = D.students.find(x=>x.id===studentId);
    let pts = 0, verified = 0, pending = 0, best = null;
    for(const r of D.reads){
      if(r.studentId !== studentId) continue;
      const sc = this.score(r, D.books.find(b=>b.id===r.bookId), student, D.settings);
      if(r.status === "verified"){ verified++; pts += sc.pts; if(sc.state==="ok" && (best===null || sc.stretch>best)) best = sc.stretch; }
      else pending++;
    }
    const rolls = D.boxes.filter(b=>b.studentId===studentId).length;
    const bonus = (D.questAwards || []).filter(a=>a.studentId===studentId).length;
    const earned = Math.floor(pts / D.settings.boxPts);
    return {pts, verified, pending, best, earned, rolls, bonus,
            available: Math.max(0, earned + bonus - rolls),
            toNext: pts - earned * D.settings.boxPts,
            crawlerLvl: Math.floor(pts / 50) + 1,
            yearTier: this.yearTier(pts, D.settings)};
  },
  yearTier(pts, s){
    let t = null;
    for(const y of s.yearTiers.slice().sort((a,b)=>a.pts-b.pts)){ if(pts >= y.pts) t = y.name; }
    return t;
  }
};

/* ---------------- helpers ---------------- */
const $ = sel => document.querySelector(sel);
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const host = $("#toasthost");
  host.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(host._t);
  host._t = setTimeout(()=>{ host.innerHTML=""; }, 2800);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
/* toast with an UNDO button — for high-frequency actions where a
   confirm dialog would just train reflex-clicking */
function toastUndo(msg, id){
  const host = $("#toasthost");
  host.innerHTML = '<div class="toast">'+esc(msg)
    + '<button class="undobtn" data-a="undoverify" data-id="'+esc(id)+'">↩ UNDO</button></div>';
  clearTimeout(host._t);
  host._t = setTimeout(()=>{ host.innerHTML=""; }, 7000);
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const p = String(iso).slice(0,10).split("-"); return Number(p[1])+"/"+Number(p[2])+"/"+p[0].slice(2); }
function tierClass(t){ return ({Common:"common", Uncommon:"uncommon", Rare:"rare", Epic:"epic", Legendary:"legendary"})[t] || "common"; }
function rankChip(rank){
  const map = {"EPIC stretch":"epic","Rare stretch":"rare","Uncommon stretch":"uncommon","On-level":"common","Fluency":"common"};
  if(!(rank in map)) return "";
  return '<span class="chip '+map[rank]+'">'+esc(rank)+'</span>';
}
function newPin(){ return String(Math.floor(1000 + Math.random()*9000)); }
const ALIAS_A = ["Ember","Storm","Frost","Moss","Thorn","Shadow","Flint","Bramble","Moon","Star",
  "Iron","Copper","Silver","Golden","Crimson","Cobalt","Thunder","Whisper","Pebble","Cinder",
  "Drift","Echo","Fable","Gale","Hollow","Ivory","Jade","Lantern","Maple","Nimbus",
  "Onyx","Quill","Rune","Sage","Tundra","Zephyr"];
const ALIAS_B = ["Fox","Otter","Badger","Wolf","Owl","Lynx","Falcon","Bear","Hare","Moth",
  "Newt","Crow","Drake","Sprite","Golem","Griffin","Knight","Ranger","Rogue","Wizard",
  "Bard","Paladin","Scout","Squire","Archer","Miner","Scribe","Keeper","Warden","Herald"];
function newAlias(taken){
  for(let i=0;i<200;i++){
    const a = ALIAS_A[Math.floor(Math.random()*ALIAS_A.length)] + " " + ALIAS_B[Math.floor(Math.random()*ALIAS_B.length)];
    if(!taken.has(a.toLowerCase())) return a;
  }
  return "Crawler " + Math.floor(100+Math.random()*900);
}
function takenAliases(list){ return new Set((list||[]).map(s=>String(s.name||"").toLowerCase())); }
function busy(el, on){ if(!el) return; el.disabled = !!on; if(on){ el.dataset.prev = el.innerHTML; el.innerHTML = '<span class="spin"></span>'; } else if(el.dataset.prev){ el.innerHTML = el.dataset.prev; } }

/* map a settings DB row -> app settings object */
function settingsFromRow(row){
  return {
    basePts: row.base_pts, fluencyPts: row.fluency_pts, belowCutoff: row.below_cutoff,
    per10L: row.per_10l, stretchCap: row.stretch_cap,
    lenBands: [{min:300, pts:row.len_300},{min:200, pts:row.len_200},{min:100, pts:row.len_100}],
    boxPts: row.box_pts, yearTiers: row.year_tiers, d100: row.d100, prizes: row.prizes,
    className: row.class_name, classCode: row.class_code,
    verifyMode: row.verify_mode,

/* title helpers: kids spell creatively */
function titleCase(t){
  const small = {a:1, an:1, the:1, of:1, and:1, or:1, to:1, in:1, on:1, at:1, for:1};
  return String(t).trim().replace(/\s+/g, " ").split(" ").map((w, i) =>
    (i > 0 && small[w.toLowerCase()]) ? w.toLowerCase() : (w.charAt(0).toUpperCase() + w.slice(1))).join(" ");
}
function _edist(a, b){
  if(Math.abs(a.length - b.length) > 3) return 99;
  const m = a.length, n = b.length;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function fuzzyBook(title){
  const norm = t => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  const q = norm(title);
  if(q.length < 3 || !BOOT || !BOOT.books) return null;
  let best = null, bestD = 99;
  for(const b of BOOT.books){
    const d = _edist(q, norm(b.title));
    if(d < bestD){ bestD = d; best = b; }
  }
  const tol = q.length <= 5 ? 1 : Math.max(2, Math.floor(q.length / 6));
  return (best && bestD <= tol) ? best : null;
}

   Both expose the same interface.
   ============================================================ */
function makeLiveAPI(){
  /* Every network call gives up after 15s instead of hanging forever.
     A wedged token refresh (laptop sleep, dropped wifi) used to hold the
     client's auth lock and make every later call spin — this releases it. */
  const _tfetch = (input, init) => {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(new DOMException("timeout", "TimeoutError")), 15000);
    if(init && init.signal){
      if(init.signal.aborted) c.abort(init.signal.reason);
      else init.signal.addEventListener("abort", () => c.abort(init.signal.reason), {once:true});
    }
    return fetch(input, Object.assign({}, init, {signal: c.signal})).finally(() => clearTimeout(t));
  };
  const sb = window.__createSupabase(CONFIG.url, CONFIG.anon, {global: {fetch: _tfetch}});
  /* A stale stored sign-in (rejected JWT) can poison every request until
     someone clears cookies. Detect it, shed the dead session, retry. */
  const _authErr = (e) => {
    const m = (((e && e.message) || "") + " " + ((e && e.code) || "")).toLowerCase();
    return m.includes("jwt") || m.includes("pgrst301") || m.includes("pgrst302")
        || m.includes("invalid token") || m.includes("token is expired")
        || m.includes("invalid claim") || m.includes("401");
  };
  function _purgeSession(){
    try{
      const ref = String(CONFIG.url).replace(/^https?:\/\//, "").split(/[./]/)[0];
      localStorage.removeItem("sb-" + ref + "-auth-token");
    }catch(e){}
  }
  async function _shedSession(){
    _purgeSession();
    try{ await withTimeout(sb.auth.signOut({scope:"local"}), 4000); }catch(e){}
    _purgeSession();
  }
  try{
    sb.auth.onAuthStateChange((event)=>{
      if(event === "PASSWORD_RECOVERY"){
        authMode = "reset"; route.screen = "tauth";
        try{ sessionStorage.setItem("bc_route", JSON.stringify(route)); }catch(e){}
        try{ render(); }catch(e){}
      }
    });
  }catch(e){}
  async function rpc(fn, args){
    let {data, error} = await sb.rpc(fn, args);
    if(error && _authErr(error)){
      await _shedSession();
      ({data, error} = await sb.rpc(fn, args));
      if(error && _authErr(error) && authRecover()) return new Promise(()=>{});
    }
    if(error) throw new Error(error.message || "server error");
    return data;
  }
  return {

    async login(code, sid, pin){ return rpc("student_login", {p_code:code, p_student:sid, p_pin:pin}); },

    async addLevel(sid, date, lvl){ const {error} = await sb.from("levels").insert({student_id:sid, on_date:date, lvl}); if(error) throw new Error(error.message); },
    async setDelivered(id, delivered){ const {error} = await sb.from("boxes").update({delivered}).eq("id", id); if(error) throw new Error(error.message); },
    async updateSettings(patch){
      if(CLS){
        /* classes table wears different names for two columns */
        const p = Object.assign({}, patch);
        if("class_name" in p){ p.name = p.class_name; delete p.class_name; }
        if("class_code" in p){ p.code = String(p.class_code).trim().toUpperCase(); delete p.class_code; }
        const {error} = await sb.from("classes").update(p).eq("id", CLS);
        if(error) throw new Error(/unique|duplicate/i.test(error.message) ? "That class code is taken — pick another" : error.message);
      } else {
        const {error} = await sb.from("settings").update(patch).eq("id", 1);
        if(error) throw new Error(error.message);
      }
    }
  };
}

      if(ex){ ex.shine = (ex.shine||0)+1; item = {id:itemId, dup:true, shine:ex.shine}; }

    async setDelivered(id, delivered){ const b = D.boxes.find(x=>x.id===id); if(b) b.delivered = delivered; save(D); },
    async updateSettings(patch){
      const s = D.settings;
      for(const [col, v] of Object.entries(patch)){
        if(col==="base_pts") s.basePts=v; else if(col==="fluency_pts") s.fluencyPts=v;
        else if(col==="below_cutoff") s.belowCutoff=v; else if(col==="per_10l") s.per10L=v;
        else if(col==="stretch_cap") s.stretchCap=v; else if(col==="box_pts") s.boxPts=v;
        else if(col==="len_100") s.lenBands.find(b=>b.min===100).pts=v;
        else if(col==="len_200") s.lenBands.find(b=>b.min===200).pts=v;
        else if(col==="len_300") s.lenBands.find(b=>b.min===300).pts=v;
        else if(col==="class_name") s.className=v; else if(col==="class_code") s.classCode=String(v).trim().toUpperCase();
        else if(col==="verify_mode") s.verifyMode=v;
        else if(col==="floor_pts") s.floorPts=v;
        else if(col==="show_tracker") s.showTracker=v;
        else if(col==="show_lexile") s.showLexile=v;
        else if(col==="year_tiers") s.yearTiers=v; else if(col==="d100") s.d100=v; else if(col==="prizes") s.prizes=v;
      }
      save(D);
    }
  };
}

/* race a promise against a deadline so nothing spins forever */
function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
/* one guarded self-refresh per browser session — automates the manual
   "refresh fixes it" recovery without ever reload-looping */
function authRecover(){
  try{
    if(sessionStorage.getItem("bc_ar")) return false;
    sessionStorage.setItem("bc_ar", "1");
    location.reload();
    return true;
  }catch(e){ return false; }
}

      CLS = cur;
      TD = await withTimeout(api.fetchAll(cur), 20000);
      TD.platform = true; TD.classes = classes; TD.classId = cur;
      try{ TD.cfg = api.fetchConfig ? await api.fetchConfig() : null; }catch(e){ TD.cfg = null; }
    } else {
      CLS = null;
      TD = await withTimeout(api.fetchAll(), 20000);
    }
    authOk();
    try{ kickScreening(); }catch(e){}
    return TD;
  }
  catch(e){
    if(e && e.auth){
      /* the stored sign-in went stale — shed it and ask for a fresh one
         instead of failing forever until someone clears cookies */
      try{ if(api.purgeSession) await api.purgeSession(); }catch(_){}
      TDERR = null; TD = null; authMode = "in";
      toast("Your sign-in expired — please sign in again");
      go({screen:"tauth"});
      return null;
    }
    TDERR = (e && e.message === "timeout") ? "the server took too long to answer" : ((e && e.message) || "server error");
    if(!quiet) toast("Couldn't load class data — " + TDERR);
    return null;
  }
}

function qNorm(raw){ return (raw || []).map(q => typeof q === "string" ? {id: q, param: null} : q); }

function qDesc(id, p){
  if(id === "tome")  return "Finish a book of " + (p || 200) + "+ pages";
  if(id === "giant") return "Finish a book of " + (p || 300) + "+ pages";
  if(id === "trio")  return "Finish your " + ordinal(p || 3) + " book in one month";
  return QUESTS[id][2];
}

/* bounty-complete moment (per student, per device) */
function checkBounty(){
  if(!SS || !route.who || SS.quest_awards === undefined) return;

/* ---- loot roll overlay (server decides the roll) ---- */
async function openLoot(){
  const btn = $('[data-a="openbox"]');
  busy(btn, true);
  let res;
  try{ res = await api.openBox(CODE, route.who, SPIN[route.who]); }
  catch(e){ busy(btn, false); toast("Can't reach the server — try again"); return; }
  busy(btn, false);
  if(!res || !res.ok){ toast(res && res.err==="frozen" ? "🧊 The dungeon gate is frozen right now — " + (fam() ? "ask your grown-up!" : "ask your teacher!") : res && res.err==="none" ? "No boxes to open yet!" : "Hmm, that didn't work — try again"); loadState().then(()=>render()); return; }
  const st = BOOT && BOOT.students.find(s=>s.id===route.who);
  const fx = TIERFX[res.tier] || TIERFX.Common;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "lootov";
  ov.innerHTML = '<div class="lootstage"><div class="chestbig' + (reduce ? "" : (fx.ms > 1600 ? " rumble2" : " rumble")) + '">🎁</div>'
    + '<div class="display" style="font-size:18px;margin-top:6px">' + esc(st ? st.name : "") + ' opens a loot box…</div></div>';
  document.body.appendChild(ov);
  setTimeout(()=>{
    if(!document.getElementById("lootov")) return;
    if(!reduce && fx.flash) ov.classList.add("flashin");
    if(!reduce && fx.shake) ov.classList.add("shakehard");
    spawnBurst(ov, fx.colors, fx.parts);
    const stage = ov.querySelector(".lootstage");
    const prizes = (BOOT && BOOT.prizes && BOOT.prizes[res.tier]) || "";
    const big = fx.ms > 1400 ? " big" : "";
    stage.innerHTML = '<div class="chestbig">🎉</div>'
      + '<div class="tiercard' + big + '" style="background:var(--t-' + tierClass(res.tier) + '-bg);color:var(--t-' + tierClass(res.tier) + '-ink)">'
      + '<div class="tn">' + esc(res.tier).toUpperCase() + '!</div>'
      + '<div class="roll">You rolled a ' + res.roll + ' out of 100</div>'
      + '<div class="flavor">' + esc(fx.flavor) + '</div>'
      + (res.item && GEAR[res.item.id] ? '<div class="newgear">'
          + (res.item.dup
            ? '\u2726 +1 shine \u2014 <span class="chip rar-'+esc(GEAR[res.item.id][2])+' gearchip">'+esc(GEAR[res.item.id][0])+' \u2726\u00d7'+res.item.shine+'</span>'
            : 'NEW GEAR \u2014 <span class="chip rar-'+esc(GEAR[res.item.id][2])+' gearchip">'+esc(GEAR[res.item.id][0])+'</span>')
          + '</div>' : '')
      + (prizes ? '<div class="hint">Prize ideas: ' + esc(String(prizes).split("·")[0].trim()) + ' &amp; more — show your teacher!</div>'
                : '<div class="hint">Show your teacher to claim your prize!</div>')
      + '</div><div style="margin-top:16px"><button class="btn gold" data-a="closeloot">Awesome!</button></div>';
  }, reduce ? 150 : fx.ms);
}

/* other kids' answers on the same book — the cheapest lie detector there is */
function peersHTML(r){
  const peers = TD.reads.filter(x => x.bookId === r.bookId && x.id !== r.id && x.a);
  if(!peers.length) return "";
  const rows = peers.slice(0, 6).map(x => {

/* AI pre-screen: quietly screen unscreened pending answers, one at a time.
   Silently stands down if the screening function isn't deployed. */
async function kickScreening(){
  if(DEMO || window.__aioff || window.__aibusy || !TD || !api.screenRead) return;
  const targets = TD.reads.filter(r => r.status === "pending" && r.a && !r.ai).slice(0, 12);
  if(!targets.length) return;
  window.__aibusy = true;
  try{
    for(const r of targets){
      try{
        const v = await api.screenRead(r.id);
        if(v && v.v){
          r.ai = v;
          if(route.screen === "teacher" && route.tab === "queue" && !typing()) render();
        } else if(v && v.error){ window.__aioff = true; break; }
      }catch(e){ window.__aioff = true; break; }
    }
  } finally { window.__aibusy = false; }
}

function recheckHTML(r){
  if(!r.q) return "";
  const rc = r.ai && r.ai.recheck;
  if(rc && rc.v){
    return '<div class="aiv aiv-'+esc(rc.v)+'">🎤 '
      + (rc.v==="ok" ? "Spoken answer checks out" : rc.v==="mismatch" ? "Spoken answer doesn’t match either" : "Still can’t verify — your call")
      + (rc.note ? ' <span class="tiny">· '+esc(rc.note)+'</span>' : "") + '</div>';
  }
  return '<details class="rc"><summary>🎤 They explained it in person?</summary>'
    + '<textarea id="rc_'+r.id+'" rows="2" maxlength="800" placeholder="Type the gist of what they told you…"></textarea>'
    + '<button class="btn small primary" data-a="recheck" data-id="'+r.id+'">Check what they said</button></details>';

function tQueue(nlq, pq){
  const lvl = nlq.map(b=>{
    const waiting = TD.reads.filter(r=>r.bookId===b.id).map(r=>{const s=tstu(r.studentId); return s&&s.name;}).filter(Boolean);
    return '<div class="qcard"><div class="info"><strong>'+esc(b.title)+'</strong>'
      + '<div class="tiny">'+(b.pages||"?")+' pages · waiting: '+esc(waiting.join(", ")||"—")+'</div></div>'
      + '<a class="btn small ghost" target="_blank" rel="noopener" data-a="copytitle" data-t="'+esc(b.title)+'" href="https://www.google.com/search?q='+encodeURIComponent(b.title+' book lexile level')+'">\ud83d\udd0e Look it up</a>'
      + '<a class="btn small ghost" target="_blank" rel="noopener" data-a="copytitle" data-t="'+esc(b.title)+'" href="https://hub.lexile.com/find-a-book/">Lexile site</a>'
      + '<input class="inline-lvl" type="number" inputmode="numeric" placeholder="level" id="lvl_'+b.id+'">'
      + '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin:0 6px">🎨<input type="checkbox" id="gn_'+b.id+'" style="width:18px;height:18px" title="graphic novel / picture-heavy"></label>'
      + '<button class="btn small primary" data-a="savelevel" data-id="'+b.id+'">Save</button></div>';
  }).join("");
  const vmode = TD.settings.verifyMode;
  const reads = pq.slice().sort((a,b)=> a.date<b.date?-1:1).map(r=>{
    const st = tstu(r.studentId), b = tbook(r.bookId);
    const prior = TD.reads.filter(x=>x.studentId===r.studentId && x.bookId===r.bookId && x.id!==r.id).length;
    const sc = st && b ? Engine.score(Object.assign({},r,{status:"verified"}), b, st, TD.settings) : {state:"x"};
    return '<div class="qcard'+(r.flagged?" flagged":"")+'"><div class="info"><strong>'+esc(st?st.name:"?")+'</strong> finished <strong>'+esc(b?b.title:"?")+'</strong>'
      + (r.flagged ? ' <span class="chip spotchk">🎲 Spot check — book talk!</span>' : "")
      + '<div class="tiny">'+fmtDate(r.date)
      + (b && b.level==null ? ' · <span class="chip lvlwait">needs level first</span>' : (sc.state==="ok" ? " · will earn "+sc.total+" pts" : ""))
      + (prior ? ' <span class="chip reread">↺ re-read #'+(prior+1)+'</span>' : "") + '</div>'
      + (r.a ? '<div class="qanswer"><span class="tiny">'+esc(r.q||"Quest Report")+'</span><br>“'+esc(r.a)+'”'
          + (r.ai && r.ai.v ? '<div class="aiv aiv-'+esc(r.ai.v)+'">'
              + (r.ai.v==="ok" ? "✅ Checks out" : r.ai.v==="mismatch" ? "🚩 Doesn’t match — book talk?" : "🤔 Can’t verify — your call")
              + (r.ai.note ? ' <span class="tiny">· '+esc(r.ai.note)+'</span>' : "") + '</div>' : "")
          + recheckHTML(r)
          + '</div>' : "")
      + peersHTML(r)
      + '</div>'
      + (vmode && vmode!=="classic" ? '<button class="btn small ghost" data-a="toggleflag" data-id="'+r.id+'" title="'+(r.flagged?"Remove the spot-check flag":"Flag for a book talk")+'">'+(r.flagged?"🎲 Unflag":"🎲 Flag")+'</button>' : "")
      + '<button class="btn small good" data-a="verify" data-id="'+r.id+'">✓ Verify</button>'
      + '<button class="btn small ghost danger" data-a="delread" data-id="'+r.id+'" data-arm="1">Remove</button></div>';
  }).join("");
  return '<div class="stack">'
    + '<div class="card"><h2>Books that need a level ('+nlq.length+')</h2>'
    + '<div class="tiny" style="margin-bottom:8px">Look it up once (Lexile “Find a Book”, or the level printed in the book) — every future reader scores automatically.</div>'
    + (lvl || '<div class="tiny">Nothing waiting. 🎉</div>') + '</div>'
    + '<div class="card"><h2>Reads to verify ('+pq.length+')</h2>'
    + '<div class="tiny" style="margin-bottom:8px">'
    + (vmode==="report" ? "Read each Quest Report, then verify — spot-talk any that feel thin."
      : vmode==="report_spot" ? "Read the Quest Report and verify. 🎲 flagged reads get a real book talk first — the dungeon picks them at random, and you can flag any read yourself."
      : "A 2-minute book talk is plenty. Verify awards the points.")
    + '</div>'
    + (reads || '<div class="tiny">Queue clear.</div>') + '</div></div>';
}

/* ============ 📷 SCAN-A-BOOK — teacher/parent phones only ============
   Camera lives on phones (no Chromebook/desktop scanner — teachers use
   their phone); keyboards get a type-the-ISBN box with the same lookup.
   Decode is 100% on-device (native BarcodeDetector when present, else the
   bundled ZXing EAN reader). Only the 13 digits ever leave the phone:
   once to public book catalogs (title+pages), once to level_hint(). */
const SCAN_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent)); /* iPadOS masquerades as Mac */
function isbnClean(raw){
  let s = String(raw || "").replace(/[^0-9Xx]/g, "").toUpperCase();
  if(s.length === 10){ /* older books print ISBN-10 — convert */
    let sum = 0;
    for(let i = 0; i < 10; i++) sum += (s[i] === "X" ? 10 : +s[i]) * (10 - i);
    if(sum % 11 !== 0) return null;
    s = "978" + s.slice(0, 9);
    let c = 0;
    for(let i = 0; i < 12; i++) c += +s[i] * (i % 2 ? 3 : 1);
    return s + ((10 - c % 10) % 10);
  }
  if(/X/.test(s)) return null;
  if(s.length === 12) s = "0" + s; /* raw UPC-A → EAN-13 shape */
  if(s.length !== 13) return null;
  let c = 0;
  for(let i = 0; i < 13; i++) c += +s[i] * (i % 2 ? 3 : 1);
  return c % 10 === 0 ? s : null;
}
const isbnBookland = (s) => /^97[89]/.test(s);
async function isbnLookup(isbn){
  const g = withTimeout(
    fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn).then(r => r.json()), 8000
  ).then(j => {
    const v = j && j.items && j.items[0] && j.items[0].volumeInfo;
    return v ? {title: v.title || "", pages: v.pageCount || null} : null;
  }).catch(() => null);
  const o = withTimeout(
    fetch("https://openlibrary.org/isbn/" + isbn + ".json").then(r => r.ok ? r.json() : null), 8000
  ).then(j => j ? {title: j.title || "", pages: j.number_of_pages || null} : null).catch(() => null);
  const [gr, or] = await Promise.all([g, o]);
  if(!gr && !or) return null;
  return {title: (gr && gr.title) || (or && or.title) || "",
          pages: (gr && gr.pages) || (or && or.pages) || null};
}
function scanBeep(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const osc = a.createOscillator(), gn = a.createGain();
    osc.frequency.value = 880; gn.gain.value = 0.12;
    osc.connect(gn); gn.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + 0.12);
    setTimeout(() => a.close(), 400);
  }catch(e){}
}

async function scanResolve(isbn){ /* digits → full result object */
  const dup = (TD && TD.books || []).find(b => b.isbn === isbn);
  if(dup) return {isbn, already: dup.title};
  const [found, hint] = await Promise.all([isbnLookup(isbn), api.levelHint(isbn)]);
  const r = {isbn, title: found ? found.title : "", pages: found ? found.pages : null,
             hint: hint || null, notFound: !found};
  if(r.title){
    const norm = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const d = (TD && TD.books || []).find(b => norm(b.title) === norm(r.title));
    if(d) r.dupTitle = d.title;
  }
  return r;
}

async function scanFrame(source, w, h){ /* → digits | null, on-device */
  const cv = document.createElement("canvas");
  const scale = Math.min(1, 900 / w);
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  cv.getContext("2d").drawImage(source, 0, 0, cv.width, cv.height);
  if(scanS && scanS.native){
    try{
      const hits = await scanS.native.detect(cv);
      if(hits && hits[0] && hits[0].rawValue) return hits[0].rawValue;
    }catch(e){}
  }
  if(window.__decodeBarcode){
    try{ return window.__decodeBarcode(cv.getContext("2d").getImageData(0, 0, cv.width, cv.height)); }catch(e){}
  }
  return null;
}
async function scanTick(){
  if(!scanS || scanS.busy) return;
  const v = document.getElementById("scanvid");
  if(!v || !v.videoWidth) return;
  scanS.busy = true;
  try{
    const digits = await scanFrame(v, v.videoWidth, v.videoHeight);
    if(digits) await scanFound(digits);
  }finally{ if(scanS) scanS.busy = false; }
}
async function scanFound(digits){
  const isbn = isbnClean(digits);
  if(!isbn) return;
  if(scanS && scanS.timer){ clearInterval(scanS.timer); scanS.timer = null; }
  scanBeep();
  if(!isbnBookland(isbn)){
    scanMsg("That’s a store barcode, not the book code — find the one starting 978 (often inside the front cover).");
    scanResume(2600); return;
  }
  scanMsg("Got it — looking up " + isbn + "…");
  const box = document.getElementById("scanres");
  if(box) box.innerHTML = scanResHTML({busy: true});
  const r = await scanResolve(isbn);
  if(r.already){
    scanMsg("✔ Already in your library: " + r.already + " — keep scanning.");
    if(box) box.innerHTML = "";
    scanResume(2200); return;
  }
  scanMsg("Check it, tweak it, add it — then scan the next one.");
  if(box) box.innerHTML = scanResHTML(r);
}
function scanResume(delay){
  setTimeout(() => {
    if(scanS && !scanS.timer && document.getElementById("scanov")){
      scanMsg("Point at the barcode on the back cover…");
      scanS.timer = setInterval(scanTick, 380);
    }
  }, delay || 0);
}
async function scanSnapFile(file){
  if(!file) return;
  scanMsg("Reading the photo…");
  try{
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const digits = await scanFrame(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    if(digits) await scanFound(digits);
    else scanMsg("Couldn’t read that photo — get closer, flatter, brighter and try again.");
  }catch(e){ scanMsg("Couldn’t read that photo — try again."); }
}

let scanInline = null;
async function isbnTyped(raw){
  const isbn = isbnClean(raw);
  if(!isbn){ toast("That doesn’t look like a full ISBN"); return; }
  if(!isbnBookland(isbn)){ toast("Book ISBNs start 978 — check under the barcode"); return; }
  scanInline = {busy: true}; render();
  const r = await scanResolve(isbn);
  scanInline = r.already ? {err: "✔ Already in your library: " + r.already} : r;
  render();
}
async function scanCommit(host, isbn){
  const g = (id) => host.querySelector(id);
  const title = (g("#sr_title") && g("#sr_title").value || "").trim();
  if(!title){ toast("Title first"); return null; }
  const pages = parseInt(g("#sr_pages") && g("#sr_pages").value, 10) || null;
  const level = parseInt(g("#sr_level") && g("#sr_level").value, 10) || null;
  const fmt = (g("#sr_gn") && g("#sr_gn").checked) ? "gn" : null;
  try{
    await api.addBook(titleCase(title), level, pages, isbn || null, fmt);
    toast("⚔️ " + title + " added");
    return true;
  }catch(e){ toast(e.message); return null; }
}

function billingCardHTML(){
  const B = billingState();
  if(!B) return "";
  const cfg = TD.cfg || {};
  const price = cfg.price_label || "the yearly pass";
  const dgn = fam() ? "crew" : "class";
  let line, btn = "";
  if(B.st === "founder") line = '🏅 <strong>Founder dungeon</strong> — free forever, with thanks for being here first.';
  else if(B.st === "active") line = '✅ <strong>Season pass active</strong> until ' + fmtDay(B.until) + '. Renewing adds a full year on top.';
  else if(B.st === "trial") line = '⏳ <strong>Free trial</strong> — ' + B.days + ' day' + (B.days === 1 ? "" : "s") + ' left (until ' + fmtDay(B.until) + '). After that the ' + dgn + ' costs ' + esc(price) + '.';
  else line = '🧊 <strong>Frozen</strong> — kids keep every point and item and can still look around; logging and loot are paused until the pass is renewed. Nothing is ever deleted.';
  if(B.st !== "founder"){
    btn = cfg.stripe_link
      ? '<div style="margin-top:10px"><button class="btn gold" data-a="renew">' + (B.st === "active" ? '🎟️ Add another year' : '🎟️ Get the season pass — ' + esc(price)) + '</button></div>'
        + '<div class="tiny" style="margin-top:6px">Card checkout via Stripe. The dungeon ' + (B.st === "frozen" ? 'thaws' : 'stays open') + ' automatically within a minute of paying — refresh after.</div>'
      : '<div class="tiny" style="margin-top:8px">(Payments aren’t switched on yet.)</div>';
  }
  return '<div class="card"><h2>🪙 Billing</h2><div style="margin:4px 0">' + line + '</div>' + btn + '</div>';
}

/* ---- exports (real downloads on a real site) ---- */
async function dl(name, text){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const d = await window.claude.use("downloads");
      if(d){
        try{ await d.save({filename:name, data:text}); toast("Saved "+name); return; }
        catch(err){
          if(err && err.code === "extension_not_enabled" && /\.csv$/.test(name)){
            try{ await d.save({filename:name.replace(/\.csv$/, ".txt"), data:text}); toast("Saved as .txt"); return; }catch(e2){}
          } else if(err && err.code === "declined"){ toast("Canceled"); return; }
        }
      }
    }
  }catch(e){}
  const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function csvCell(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function csvLog(){
  const head = "Date,Student,Book,Pages,Book Level,Level At Read,Stretch,Status,Points";
  const rows = TD.reads.slice().sort((a,b)=> a.date<b.date?-1:1).map(r=>{
    const st = tstu(r.studentId), b = tbook(r.bookId);
    const sc = st && b ? Engine.score(r, b, st, TD.settings) : {state:"x"};
    return [r.date, st?st.name:"?", b?b.title:"?", b?(b.pages||""):"", b&&b.level!=null?b.level:"",
      sc.state==="ok"?Engine.levelAt(st,r.date):"", sc.state==="ok"?sc.stretch:"", r.status,
      sc.state==="ok"?sc.pts:0].map(csvCell).join(",");
  });
  return [head].concat(rows).join("\n");
}

/* ---- year-end ceremony (teacher, projector) ---- */
let CER = null;
function tierIdxFor(pts, tiers){ let idx = -1; tiers.forEach((t,i)=>{ if(pts >= t.pts) idx = i; }); return idx; }
function startCeremony(){
  if(!TD || !TD.students.length){ toast("No crawlers yet"); return; }
  const tiers = TD.settings.yearTiers.slice().sort((a,b)=>a.pts-b.pts);
  const list = TD.students.map(st=>{
    const t = Engine.totals(st.id, TD);
    return {name:st.name, pts:t.pts, books:t.verified, best:t.best, ti:tierIdxFor(t.pts, tiers)};
  }).sort((a,b)=> (a.ti - b.ti) || (a.pts - b.pts));
  CER = {list, tiers, i:-1};
  const ov = document.createElement("div");
  ov.className = "ceremony"; ov.id = "cereov";
  document.body.appendChild(ov);
  renderCeremony();
}
function endCeremony(){ document.getElementById("cereov")?.remove(); CER = null; }
function renderCeremony(){
  const ov = document.getElementById("cereov");
  if(!ov || !CER) return;
  const N = CER.list.length;
  const CCOLORS = [["#EAD5C0","#B98554","#FFFFFF"],["#E8E8EE","#9C9CB0","#FFFFFF"],["#F5CF7E","#E8A33D","#FFFFFF"],["#9FE0DC","#DDF0EE","#FFFFFF"],["#7FE3E0","#F5CF7E","#FFFFFF","#C9B5F0"]];
  if(CER.i === -1){
    ov.innerHTML = '<div class="cerewrap"><div class="cerekicker">'+esc(TD.settings.className||"")+'</div>'
      + '<div class="cerename">THE YEAR-END<br>CEREMONY</div>'
      + '<div class="cerestats">'+N+' crawlers \u00b7 one year \u00b7 every box guaranteed</div>'
      + '<div class="cerectl"><button class="btn gold big" style="width:auto" data-a="cerenext">Begin \u2192</button>'
      + '<button class="btn ghost" data-a="cereexit">Exit</button></div></div>';
    return;
  }
  if(CER.i >= N){
    const totB = CER.list.reduce((a,x)=>a+x.books,0), totP = CER.list.reduce((a,x)=>a+x.pts,0);
    const deep = CER.list.reduce((a,x)=>Math.max(a, pfloorOf(x.pts)), 1);
    ov.innerHTML = '<div class="cerewrap"><div class="cerekicker">THE CRAWL IS COMPLETE</div>'
      + '<div class="cerename">'+totB+' BOOKS</div>'
      + '<div class="cerestats">'+totP+' points as a '+(fam()?'crew':'class')+' \u00b7 the deepest crawler reached FLOOR '+deep+': '+esc(PFLOORS[deep-1].name)+'</div>'
      + '<div class="cerestats" style="font-style:italic">Well fought, crawlers. The dungeon will remember you.</div>'
      + '<div class="cerectl"><button class="btn gold" data-a="cereexit">End ceremony</button></div></div>';
    spawnBurst(ov, ["#F5CF7E","#E8A33D","#A79BE0","#7FE3E0","#FFFFFF"], 160);
    return;
  }
  const c = CER.list[CER.i];
  const tier = c.ti >= 0 ? CER.tiers[c.ti] : null;
  const last = CER.i === N - 1;
  const boxHtml = tier
    ? '<div class="cerebox yt'+Math.min(c.ti,4)+(c.ti>=4?" pulse":"")+'">'+esc(tier.name).toUpperCase()+'</div>'
    : '<div class="cerebox none">HONORARY CRAWLER \u2014 every floor was walked</div>';
  ov.innerHTML = '<div class="cerecount">'+(CER.i+1)+' / '+N+'</div>'
    + '<div class="cerewrap"><div class="cerekicker">'+(c.ti>=4?"AGAINST ALL ODDS":"THE VAULT OPENS FOR")+'</div>'
    + '<img class="cereav" alt="" src="'+avatarFor(c.name)+'">'
    + '<div class="cerename">'+esc(c.name)+'</div>'
    + '<div class="cerestats">'+c.books+' book'+(c.books===1?"":"s")+' \u00b7 '+c.pts+' points'
    + (c.best!=null && c.best>0 ? ' \u00b7 biggest stretch '+c.best+'L' : '')+'</div>'
    + boxHtml
    + '<div class="cerectl"><button class="btn gold" data-a="cerenext">'+(last?"The finale \u2192":"Next crawler \u2192")+'</button>'
    + '<button class="btn ghost" data-a="cereexit">Exit</button></div></div>';
  const colors = c.ti >= 0 ? CCOLORS[Math.min(c.ti,4)] : ["#B9B3D1","#7C76A0"];
  spawnBurst(ov, colors, c.ti >= 4 ? 160 : c.ti >= 0 ? 60 + c.ti*25 : 24);
}

/* ============================================================
   DUNGEON BACKDROP — procedural pixel art, painted once per
   load/resize/theme. Original blocky art, no image assets.
   ============================================================ */
function bgEnabled(){ try{ return localStorage.getItem("bc_bg") !== "0"; }catch(e){ return true; } }
function isDarkTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintDungeon(){
  const cv = document.getElementById("dungeonbg");
  const glow = document.getElementById("dungeonglow");
  if(!cv) return;
  if(!bgEnabled()){ cv.style.display = "none"; if(glow) glow.style.display = "none"; return; }
  cv.style.display = ""; if(glow) glow.style.display = "";
  const dark = isDarkTheme();
  const scale = 4;                               // 1 art pixel = 4 screen px
  const W = Math.ceil(window.innerWidth / scale);
  const H = Math.ceil(window.innerHeight / scale);
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const R = (n) => Math.floor(Math.random() * n);
  const P = dark ? {
    stones:["#282344","#2E2950","#332D58","#252041"], mortar:"#1C1836",
    moss:"#31513C", crack:"#171331", floor:"#1F1B3C",
    shelf:"#4A3524", spine:["#B34A44","#3F7E5A","#3E5F9E","#B08A3E","#7C4E9E","#9E9E9E"],
    chest:"#5C4126", chestband:"#C9A23F", stick:"#6B4A2B",
    flame1:"#FFB347", flame2:"#FFE08A",
    glowA:"rgba(255,170,60,.16)", glowB:"rgba(255,170,60,0)",
    vin:"rgba(8,6,20,.42)"
  } : {
    stones:["#E3DFD4","#DCD7CA","#D5CFC1","#E8E4DA"], mortar:"#C7C0B1",
    moss:"#B5C9A8", crack:"#BDB5A3", floor:"#D8D2C4",
    shelf:"#B08A62", spine:["#D98B85","#8FBF9F","#8FA8D9","#D9BC7A","#B195CF","#BFBFBF"],
    chest:"#B98F5D", chestband:"#D9B85C", stick:"#A57B4F",
    flame1:"#FFB347", flame2:"#FFE9A8",
    glowA:"rgba(255,190,90,.14)", glowB:"rgba(255,190,90,0)",
    vin:"rgba(120,105,80,.14)"
  };
  // floor theme override — the signed-in crawler's own depth colors the walls
  try{
    const pf = (SS && route.who) ? pfloorOf(SS.pts) : 1;
    const ovp = palForFloor(pf);
    if(ovp) Object.assign(P, dark ? ovp.dark : ovp.light);
  }catch(e){}
  // stone bricks
  const bh = 9, bw = 20;
  for(let row = 0; row * bh < H; row++){
    const off = (row % 2) ? bw/2 : 0;
    for(let col = -1; col * bw < W + bw; col++){
      const bx = col * bw + off, by = row * bh;
      x.fillStyle = P.mortar; x.fillRect(bx, by, bw, bh);
      x.fillStyle = P.stones[R(P.stones.length)];
      x.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
      if(R(10) === 0){ x.fillStyle = P.moss; x.fillRect(bx + 2 + R(10), by + bh - 3, 3 + R(4), 2); }
      if(R(14) === 0){ x.fillStyle = P.crack; x.fillRect(bx + 3 + R(8), by + 2, 1, 3 + R(3)); }
    }
  }
  // floor strip
  x.fillStyle = P.floor; x.fillRect(0, H - 6, W, 6);
  // torches along an upper band
  const torches = [];
  const gap = Math.max(70, Math.floor(W / Math.max(2, Math.floor(W / 90))));
  for(let tx = Math.floor(gap / 2); tx < W; tx += gap){
    const ty = 18 + R(6);
    torches.push([tx, ty]);
    x.fillStyle = P.stick; x.fillRect(tx, ty + 3, 2, 6);
    x.fillStyle = P.flame1; x.fillRect(tx - 1, ty, 4, 3);
    x.fillStyle = P.flame2; x.fillRect(tx, ty - 2, 2, 3);
  }
  // furniture along the lower half: bookshelves and chests
  const items = 2 + Math.floor(W / 150);
  for(let i = 0; i < items; i++){
    const ix = 10 + R(Math.max(20, W - 40));
    const iy = H - 8;
    if(R(3) === 0){ // chest
      x.fillStyle = P.chest; x.fillRect(ix, iy - 8, 12, 8);
      x.fillStyle = P.chestband; x.fillRect(ix, iy - 5, 12, 1); x.fillRect(ix + 5, iy - 6, 2, 3);
    } else { // bookshelf
      x.fillStyle = P.shelf; x.fillRect(ix, iy - 14, 16, 14);
      for(const sy of [iy - 12, iy - 6]){
        let sx = ix + 1;
        while(sx < ix + 14){ const w = 2; x.fillStyle = P.spine[R(P.spine.length)]; x.fillRect(sx, sy, w, 4); sx += w + 1; }
      }
    }
  }
  // rare diamond easter egg (~1 in 6 loads)
  if(R(6) === 0){
    const dx = 10 + R(W - 20), dy = 12 + R(H - 30);
    x.fillStyle = dark ? "#7FE3E0" : "#5BC8C5";
    x.fillRect(dx, dy, 2, 2); x.fillRect(dx - 1, dy + 1, 1, 1); x.fillRect(dx + 2, dy + 1, 1, 1);
  }
  // torch glow overlay + center-lightening vignette
  if(glow){
    const g = torches.map(([tx, ty]) =>
      "radial-gradient(circle at " + (tx * scale) + "px " + (ty * scale) + "px, " + P.glowA + " 0, " + P.glowB + " " + (140) + "px)").join(",");
    glow.style.background = g;
  }
  x.fillStyle = P.vin;
  x.fillRect(0, 0, W, 4); x.fillRect(0, H - 4, W, 4); x.fillRect(0, 0, 3, H); x.fillRect(W - 3, 0, 3, H);
}

/* ============================================================
   JUICE — avatars, floors, tiered reveals, level-ups
   ============================================================ */
/* deterministic pixel avatar from crawler name (nothing stored) */
const _avCache = {};
function avatarFor(name){
  if(_avCache[name]) return _avCache[name];
  let h = 2166136261 >>> 0;
  for(const ch of String(name)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h = Math.imul(h ^ (h>>>15), 2246822519) >>> 0; h = Math.imul(h ^ (h>>>13), 3266489917) >>> 0; return ((h ^= h>>>16) >>> 0) / 4294967296; };
  const hue = Math.floor(rnd() * 360);
  const base = "hsl(" + hue + ",62%,52%)", acc = "hsl(" + ((hue + 150) % 360) + ",70%,58%)";
  const c = document.createElement("canvas"); c.width = 8; c.height = 8;
  const x = c.getContext("2d");
  for(let ry = 0; ry < 8; ry++) for(let rx = 0; rx < 4; rx++){
    const v = rnd();
    if(v > 0.52){ x.fillStyle = v > 0.86 ? acc : base; x.fillRect(rx, ry, 1, 1); x.fillRect(7 - rx, ry, 1, 1); }
  }
  x.fillStyle = base; x.fillRect(2, 2, 4, 3);           // face
  x.fillStyle = "#191625"; x.fillRect(2, 3, 1, 1); x.fillRect(5, 3, 1, 1);  // eyes
  if(rnd() > 0.5){ x.fillRect(3, 4, 2, 1); }            // mouth sometimes
  x.fillStyle = base; x.fillRect(2, 7, 1, 1); x.fillRect(5, 7, 1, 1);       // feet
  return (_avCache[name] = c.toDataURL());
}
function avImg(name, cls){ return '<img class="avatarimg' + (cls ? " " + cls : "") + '" alt="" src="' + avatarFor(name) + '">'; }



/* ============================================================
   THE DESCENT BOARD — one shared shaft, every crawler's avatar
   sitting at their own floor. Cosmetic-narrative only.
   ============================================================ */
let __desc = null;
function paintDescent(){
  const cv = document.getElementById("descmap");
  if(!cv || !__desc) return;
  const dark = isDarkTheme();
  const RH = 16, DH = 12, W = 160, N = PFLOORS.length;
  cv.width = W; cv.height = N * RH + DH;
  const x = cv.getContext("2d");
  let seed = 77;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const BASE = dark
    ? {stones:["#282344","#2E2950","#332D58","#252041"], mortar:"#1C1836", moss:"#31513C", floor:"#1F1B3C"}

/* particle burst — pixel squares, one-shot */
function spawnBurst(host, colors, count){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.className = "fx"; cv.width = window.innerWidth; cv.height = window.innerHeight;
  host.appendChild(cv);
  const x = cv.getContext("2d");
  const cx = cv.width / 2, cy = cv.height / 2 - 60;
  const ps = [];
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
    ps.push({x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 4, s:3 + Math.random()*5,
             c:colors[Math.floor(Math.random()*colors.length)], life:50 + Math.random()*35});
  }
  let frame = 0;
  (function tick(){
    frame++;
    x.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for(const p of ps){
      if(frame > p.life) continue;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.vx *= 0.99;
      x.globalAlpha = Math.max(0, 1 - frame / p.life);
      x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s);
    }
    x.globalAlpha = 1;
    if(alive) requestAnimationFrame(tick); else cv.remove();
  })();
}

  Rare:     {ms:1250, parts:44,  colors:["#9CC8F0","#5B9BD5","#FFFFFF"], flavor:"The shelves whisper your name."},
  Epic:     {ms:1550, parts:80,  colors:["#C9B5F0","#9A6BD0","#FFD97A"], shake:true, flavor:"The dungeon takes notice."},
  Legendary:{ms:2300, parts:150, colors:["#F5CF7E","#E8A33D","#FFFFFF","#7FE3E0"], shake:true, flash:true, flavor:"The entire dungeon is watching."}
};

/* floor-descent moment (YOU reached a new floor since this device last looked) */
function checkFloorEvent(){
  if(!SS || !route.who) return;
  const f = pfloorOf(SS.pts);
  const key = "bc_pfloor_" + route.who;
  let prev = null;
  try{ prev = localStorage.getItem(key); }catch(e){}
  if(prev !== null && f > Number(prev)){
    const fl = PFLOORS[f - 1];
    const ov = document.createElement("div");
    ov.className = "overlay"; ov.id = "floorov";
    ov.innerHTML = '<div class="floorbanner"><div class="f1">YOU DESCEND, CRAWLER…</div>'
      + '<div class="f2">FLOOR ' + f + '</div>'
      + '<div class="f1" style="margin-top:6px">' + esc(fl.name) + '</div>'
      + '<div class="f3">' + esc(fl.lore) + '</div>'
      + '<div style="margin-top:18px"><button class="btn gold" data-a="closefloor">Onward!</button></div></div>';
    document.body.appendChild(ov);
    spawnBurst(ov, ["#F5CF7E","#E8A33D","#A79BE0","#FFFFFF"], 90);
    paintDungeon();
  }
  try{ localStorage.setItem(key, String(f)); }catch(e){}
}
/* level-up moment (per student, per device) */
function checkLevelUp(){
  if(!SS || !route.who) return;
  const key = "bc_lvl_" + route.who;
  let prev = null;
  try{ prev = sessionStorage.getItem(key); }catch(e){}
  if(prev !== null && SS.crawler_lvl > Number(prev)){
    toast("⭐ LEVEL " + SS.crawler_lvl + " CRAWLER!");
    spawnBurst(document.body, ["#F5CF7E","#E8A33D","#FFFFFF"], 60);
  }
  try{ sessionStorage.setItem(key, String(SS.crawler_lvl)); }catch(e){}
}

/* ============================================================
   STAGE 1 — GEAR. Procedural item catalog, drops ride box rolls.
   ============================================================ */
const GEAR = {
  /* id: [name, slot, rarity, shape, colors] */
  head_cap:    ["Leather Cap","head","Common","cap",["#8A5A2B","#6B4520"]],
  head_helm:   ["Iron Helm","head","Common","helm",["#9AA0AC","#6E7480"]],
  head_hood:   ["Gray Hood","head","Common","hood",["#6E6E7E","#565664"]],
  hand_sword:  ["Wooden Sword","hand","Common","sword",["#C9A16B","#8A5A2B"]],
  hand_torch:  ["Torch","hand","Common","torch",["#8A5A2B","#FFB347","#FFE08A"]],
  back_cloak:  ["Patchwork Cloak","back","Common","cloak",["#8A6E4B","#6B532F"]],
  back_pack:   ["Traveler's Pack","back","Common","pack",["#8A5A2B","#C9A16B"]],
  comp_mouse:  ["Dust Mouse","comp","Common","critter",["#B7AFa6".replace("a","A"),"#8F877E"]],
  title_brave: ["the Brave","title","Common",null,null],
  title_page:  ["Page Turner","title","Common",null,null],
  head_wizard: ["Wizard Hat","head","Uncommon","pointy",["#4C3D8F","#38306B"]],
  head_twig:   ["Crown of Twigs","head","Uncommon","twigs",["#7A9A4B","#5C7A33"]],
  hand_quill:  ["Quill of Power","hand","Uncommon","quill",["#EFEDF8","#8FA8D9"]],
  hand_axe:    ["Battle Axe","hand","Uncommon","axe",["#8A5A2B","#9AA0AC"]],
  back_cape:   ["Emerald Cape","back","Uncommon","cape",["#2E7D4F","#1E5C38"]],
  comp_beetle: ["Torch Beetle","comp","Uncommon","critter",["#B3542E","#FFB347"]],
  title_curious:["the Curious","title","Uncommon",null,null],
  title_shelf: ["Shelf Seeker","title","Uncommon",null,null],
  head_horned: ["Horned Helm","head","Rare","horned",["#6E7480","#EFEDF8"]],
  hand_frost:  ["Frost Staff","hand","Rare","staff",["#8A5A2B","#7FD3F0"]],
  back_storm:  ["Storm Cloak","back","Rare","cape",["#3E5F9E","#2C4370"]],
  comp_owl:    ["Owl Chick","comp","Rare","critter",["#C9A16B","#EFEDF8"]],
  title_tome:  ["Tome Hunter","title","Rare",null,null],
  head_crown:  ["Golden Crown","head","Epic","crown",["#E8A33D","#F5CF7E"]],
  hand_flame:  ["Flame Blade","hand","Epic","blade",["#FFB347","#E84D2E"]],
  back_wings:  ["Dragon Wings","back","Epic","wings",["#7C4E9E","#5B3E7E"]],
  comp_drake:  ["Baby Drake","comp","Epic","critter",["#5FB86B","#2E7D4F"]],
  title_unstop:["the Unstoppable","title","Epic",null,null],
  head_halo:   ["Halo of Stars","head","Legendary","halo",["#F5CF7E","#FFFFFF"]],
  hand_cosmic: ["Cosmic Scepter","hand","Legendary","scepter",["#7FE3E0","#C9B5F0"]],
  back_comet:  ["Comet Trail","back","Legendary","trail",["#7FE3E0","#F5CF7E"]],
  comp_wisp:   ["Star Wisp","comp","Legendary","critter",["#7FE3E0","#FFFFFF"]],
  title_legend:["Legend of the Stacks","title","Legendary",null,null]
};
const GEAR_POOLS = {Common:[],Uncommon:[],Rare:[],Epic:[],Legendary:[]};
Object.keys(GEAR).forEach(id => GEAR_POOLS[GEAR[id][2]].push(id));
const SLOTS = ["head","hand","back","comp","title"];
const SLOT_NAMES = {head:"Head", hand:"Hand", back:"Back", comp:"Companion", title:"Title"};

function drawGearItem(x, id){
  const def = GEAR[id]; if(!def || !def[3]) return;
  const [ , , , shape, c] = def;
  const F = (col, px, py, w, h) => { x.fillStyle = col; x.fillRect(px, py, w, h); };
  switch(shape){
    case "cap":    F(c[0],4,2,8,2); F(c[1],3,4,10,1); break;
    case "helm":   F(c[0],4,1,8,3); F(c[1],4,4,8,1); F("#1c1c2e",6,3,1,1); F("#1c1c2e",9,3,1,1); break;
    case "hood":   F(c[0],5,0,6,1); F(c[0],4,1,8,2); F(c[1],3,3,10,1); break;
    case "pointy": F(c[0],7,0,2,1); F(c[0],6,1,4,1); F(c[0],5,2,6,1); F(c[1],3,3,10,1); break;
    case "twigs":  F(c[0],4,3,8,1); F(c[1],5,1,1,2); F(c[1],8,0,1,3); F(c[1],11,1,1,2); break;
    case "horned": F(c[0],4,2,8,2); F(c[1],2,0,2,3); F(c[1],12,0,2,3); break;
    case "crown":  F(c[0],4,2,8,2); F(c[1],4,0,1,2); F(c[1],7,0,2,2); F(c[1],11,0,1,2); break;
    case "halo":   F(c[0],4,0,8,1); F(c[1],4,0,1,1); F(c[1],8,0,1,1); F(c[1],11,0,1,1); break;
    case "sword":  F(c[1],13,10,2,1); F(c[0],13,4,1,6); break;
    case "torch":  F(c[0],13,7,1,4); F(c[1],12,4,3,3); F(c[2],13,3,1,2); break;
    case "quill":  F(c[0],13,4,1,6); F(c[1],12,4,2,2); break;
    case "axe":    F(c[0],13,5,1,6); F(c[1],11,3,3,3); break;
    case "staff":  F(c[0],13,5,1,7); F(c[1],12,3,3,3); F("#FFFFFF",13,4,1,1); break;
    case "blade":  F(c[1],13,9,2,1); F(c[0],13,3,1,6); F(c[1],12,4,1,2); break;
    case "scepter":F(c[0],13,5,1,7); F(c[1],11,2,4,1); F(c[1],12,3,2,2); F("#FFFFFF",13,1,1,1); break;
    case "cloak":  F(c[0],1,5,3,7); F(c[1],1,11,3,1); break;
    case "pack":   F(c[0],1,6,3,4); F(c[1],1,7,3,1); break;
    case "cape":   F(c[0],1,4,3,8); F(c[1],0,10,2,2); break;
    case "wings":  F(c[0],0,3,3,2); F(c[0],1,5,3,3); F(c[1],0,8,2,2); break;
    case "trail":  F(c[0],0,10,2,2); F(c[1],1,7,2,2); F(c[0],2,4,2,2); F("#FFFFFF",1,3,1,1); break;
    case "critter":F(c[0],12,12,3,3); F(c[1],12,11,1,1); F(c[1],14,11,1,1); F("#1c1c2e",13,13,1,1); break;
  }
}
const _gearCache = {};
function avatarGeared(name, equipped){
  equipped = equipped || {};
  const key = name + "|" + SLOTS.map(s=>equipped[s]||"").join(",");
  if(_gearCache[key]) return _gearCache[key];
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const x = c.getContext("2d");
  if(equipped.back) drawGearItem(x, equipped.back);
  const base = document.createElement("canvas"); base.width = 8; base.height = 8;
  _redrawBase(base.getContext("2d"), name);
  x.drawImage(base, 4, 4);
  if(equipped.head) drawGearItem(x, equipped.head);
  if(equipped.hand) drawGearItem(x, equipped.hand);
  if(equipped.comp) drawGearItem(x, equipped.comp);
  return (_gearCache[key] = c.toDataURL());
}
function _redrawBase(x, name){
  let h = 2166136261 >>> 0;
  for(const ch of String(name)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h = Math.imul(h ^ (h>>>15), 2246822519) >>> 0; h = Math.imul(h ^ (h>>>13), 3266489917) >>> 0; return ((h ^= h>>>16) >>> 0) / 4294967296; };
  const hue = Math.floor(rnd() * 360);
  const base = "hsl(" + hue + ",62%,52%)", acc = "hsl(" + ((hue + 150) % 360) + ",70%,58%)";
  for(let ry = 0; ry < 8; ry++) for(let rx = 0; rx < 4; rx++){
    const v = rnd();
    if(v > 0.52){ x.fillStyle = v > 0.86 ? acc : base; x.fillRect(rx, ry, 1, 1); x.fillRect(7 - rx, ry, 1, 1); }
  }
  x.fillStyle = base; x.fillRect(2, 2, 4, 3);
  x.fillStyle = "#191625"; x.fillRect(2, 3, 1, 1); x.fillRect(5, 3, 1, 1);
  if(rnd() > 0.5){ x.fillRect(3, 4, 2, 1); }
  x.fillStyle = base; x.fillRect(2, 7, 1, 1); x.fillRect(5, 7, 1, 1);
}
function gearImg(name, equipped, cls){
  return '<img class="avatarimg' + (cls ? " " + cls : "") + '" alt="" src="' + avatarGeared(name, equipped) + '">';
}
