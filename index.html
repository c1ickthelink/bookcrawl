  }
  if(/terminal|computer|screen|machine/.test(n) && S.room === "vest") return ucSay("It hums. The screen shows exactly what you are reading right now. Spooky.");
  if(/door/.test(n) && S.room === "hall") return ucSay(S.doorOpen ? "The stone door stands open. Its carved mouth is smiling now." : "A stone door with a carved mouth. It wants a word that means the same as <em>BRAVE</em>. Doors down here are very particular.");
  if(/mushroom|rotcap|glimmercap|puffcap|caps?$/.test(n) && S.room === "cellar") return ucSay("Rotcaps (brownish, suspicious), glimmercaps (pale blue, calm), puffcaps (round, twitchy). The <em>JOURNAL</em> on the barrel seems to know all about them.");
  if(/journal|barrel/.test(n) && S.room === "cellar") return ucRead("journal");
  if(/scribble|ghost|librarian/.test(n) && S.room === "nook") return ucSay("Scribble is see-through, ink-stained, and has the posture of someone who alphabetizes for fun. He waves.");
  if(/book/.test(n) && S.room === "nook") return ucSay("A slim green book titled <em>THE FIRST DOOR</em>. It looks exactly like the kind of book with answers in it.");
  if(/sock/.test(n) && S.room === "sock") return ucSay("So many single socks. One near the top has the letters <em>B.B.</em> stitched in gold thread. Hmm.");
  if(/tile|water|stair/.test(n) && S.room === "stair") return ucSay("Mossy tiles: green, wet, smug. Cracked tiles: pale, dry, trustworthy-looking. The chiseled warning says: “THE WATER LOVES MOSS.”");
  if(/gate|carving|door/.test(n) && S.room === "gate") return ucSay(S.lit ? "Tall as three teachers, covered in carved books and lanterns. It is waiting for one word." : "Too dark to see more than a looming door-shape.");
  if(/glimmercap/.test(n) && ucHas("glimmercap")) return ucSay("Your glimmercap glows softly in the bag, like a night-light with good manners.");
  ucSay("You peer at it, but there’s not much more to see. (LOOK by itself re-reads the room.)");
}

function ucRead(n){
  var S = UC.S;
  if(ucCh1Read(n)) return;
  if(S.room === "cellar" && (!n || /journal|sign|page|book/.test(n))){
    S.readJournal = true; ucSaveSoon();
    return ucSay("The journal says: “Rotcaps smell like a gym bag full of old cheese. Puffcaps burst into sneezy spores if you so much as look at them funny. But glimmercaps are <em>LUMINOUS</em> — one cap glows bright enough to read a whole book by.”");
  }
  if(S.room === "nook" && (!n || /book|green|first|door/.test(n))){
    S.readBook = true; ucSaveSoon();
    return ucSay("<em>THE FIRST DOOR</em> says: “The Lantern Gate was built by the Bookbinder. She loved three things in this world: morning light, a strong cup of tea, and the exact <em>MIDDLE</em> of every story — because, she said, that is where the good stuff hides.”");
  }
  if(S.room === "vest" && n && /note|wall|chalk/.test(n)) return ucSay("“WELCOME, DEPTHS-DIVER. MIND THE PUDDLES.” It is signed with a tiny drawing of a sock.");
  if(S.room === "stair" && n && /warning|wall|sign/.test(n)) return ucSay("“THE WATER LOVES MOSS.” Chiseled deep, like someone learned this the hard way.");
  ucSay("There’s nothing here to read — except everything on this screen, which you are already doing. Nice.");
}

function ucTake(n){
  var S = UC.S;
  if(n && ucCh1Take(n)) return;
  if(!n) return ucSys("Take what? Name the thing, like TAKE LANTERN.");
  if(/lantern|lamp$/.test(n)){
    if(S.haveLantern) return ucSay("The lantern is already in your bag, rattling companionably.");
    if(S.room !== "lamp") return ucSay("You don’t see a lantern here. The Lamp Room had shelves of them.");
    S.haveLantern = true; S.bag.push("brass lantern"); ucSaveSoon();
    return ucSay("You take the <em>brass lantern</em>. It rattles softly, like it misses having a light inside. (Type <em>BAG</em> to see what you carry.)");
  }
  if(S.room === "cellar" && /mushroom/.test(n) && !/rot|glimmer|puff/.test(n)){
    return ucSay("Which one — the <em>ROTCAP</em>, the <em>GLIMMERCAP</em>, or the <em>PUFFCAP</em>? The journal on the barrel might help. (Try READ JOURNAL.)");
  }
  if(/rotcap/.test(n)){
    if(S.room !== "cellar") return ucSay("No rotcaps here, thank goodness.");
    return ucSay("You reach for a rotcap and immediately regret it. It smells like a gym bag full of old cheese. You put it back and apologize to your own nose.");
  }
  if(/puffcap/.test(n)){
    if(S.room !== "cellar") return ucSay("No puffcaps here.");
    return ucSay("You barely touch the puffcap. <em>POOF.</em> A cloud of sneezy spores. Ah— ah— AH-CHOO. Somewhere, the Dungeon says “bless you.”");
  }
  if(/glimmer/.test(n)){
    if(ucHas("glimmercap")) return ucSay("You already have a glimmercap. It hums a tiny glowing hum.");
    if(S.room !== "cellar") return ucSay("Glimmercaps grow in the Mushroom Cellar, west of the echo hall.");
    S.haveGlimmer = true; S.bag.push("glimmercap"); ucSaveSoon();
    return ucSay("You pick one <em>glimmercap</em>. It glows a soft, friendly blue-green, like a night-light with good manners. (LUMINOUS, just like the journal said.)");
  }
  if(/sock/.test(n)){
    if(S.room !== "sock") return ucSay("No spare socks here. The Dungeon keeps them all in one drawer, like a weirdo.");
    S.socks++; ucSaveSoon();
    if(S.socks === 1){ S.bag.push("one warm sock"); return ucSay("You take one perfectly folded sock. It is warm. <em>Why is it warm?</em>"); }
    if(S.socks === 2) return ucSay("You take another sock. Somewhere, the Dungeon sighs contentedly.");
    if(S.socks === 3) return ucSay("This one has the letters <em>B.B.</em> stitched in gold thread. Hmm. B.B… someone bookish, maybe.");
    return ucSay("You have enough socks. The Dungeon gently closes the drawer and gives you a look.");
  }
  if(/book/.test(n) && S.room === "nook") return ucGhost("Ah ah ah — reference section! It stays on the desk. But you may READ it as many times as you like.");
  if(/journal/.test(n) && S.room === "cellar") return ucSay("The journal is chained to the barrel. Farmers trust nobody.");
  ucSay("You don’t see that here to take.");
}

function ucUse(rest){
  var S = UC.S, str = rest.join(" ");
  if(ucCh1Use(str)) return;
  var pair = /glimmer/.test(str) && /lantern/.test(str);
  if(!pair && /lantern/.test(str) && rest.length <= 1) pair = ucHas("glimmercap");
  if(pair){
    if(!S.haveLantern) return ucSay("You’d need the lantern first. It was in the Lamp Room.");
    if(!ucHas("glimmercap")) return ucSay("You’d need a glimmercap first. The cellar journal knew which mushroom glows.");
    if(S.loaded) return ucSay("The glimmercap is already tucked inside the lantern. What was Scribble’s step two?");
    S.loaded = true; ucSaveSoon();
    return ucSay("You tuck the glimmercap into the lantern and click its little door shut. Step one: <em>done</em>. (Scribble said there were more steps — in order.)");
  }
  ucSay("Hmm, those don’t seem to go together. (If you’re following Scribble’s recipe, HINT remembers the steps.)");
}

function ucShake(n){
  var S = UC.S;
  if(n && !/lantern|lamp$/.test(n)) return ucSay("You shake it. Nothing happens, but it probably needed that.");
  if(!S.haveLantern) return ucSay("Nothing lantern-shaped to shake yet.");
  if(!S.loaded) return ucSay("You shake the empty lantern. It rattles sadly. Maybe something should go <em>in</em> it first?");
  if(S.lit) return ucSay("Careful! It’s lit and it likes its current arrangement.");
  if(S.shaken) return ucSay("Already shaken. The glow swirls, waiting for one last thing. What was step three?");
  S.shaken = true; ucSaveSoon();
  return ucSay("You shake the lantern. Sloshy green light swirls inside like a tiny storm. Step two: <em>done</em>. One step left…");
}

function ucWin(){
  var S = UC.S;
  S.done = true;
  ucSay("The gate rumbles. Gold light spills from the seams. “THE MIDDLE,” the door agrees. “WHERE THE GOOD STUFF HIDES.”");
  ucSay("The Lantern Gate swings open. Beyond it: a hallway lined with ten thousand sleeping books, and a sign — <em>CHAPTER ONE: THE LIBRARY OF TEETH.</em>");
  ucSys("✨ You opened the Lantern Gate — " + S.cmds + " command" + (S.cmds === 1 ? "" : "s") + " typed, " + S.hints + " hint" + (S.hints === 1 ? "" : "s") + ", " + S.socks + " sock" + (S.socks === 1 ? "" : "s") + ". The way <em>NORTH</em> stands open \u2014 <em>CHAPTER ONE: THE LIBRARY OF TEETH</em>. (Or keep exploring \u2014 the library keeps.)");
  ucSaveNow();
}

function ucSayWord(words){
  var S = UC.S;
  if(!words.length) return ucSys("Say what? Like this: SAY GLOW.");
  var w = words.join(" ");
  if(/^glow$/.test(w)){
    if(S.lit) return ucSay("“Glow,” you say. The lantern, already glowing, glows a bit harder to be polite.");
    if(S.shaken){ S.lit = true; ucSaveSoon(); return ucSay("“<em>GLOW</em>,” you say, like you mean it. The lantern flares to life — a warm, steady, book-reading light. Step three: <em>done</em>. Scribble would be proud."); }
    if(S.loaded) return ucSay("You say “glow.” The lantern jiggles expectantly. It wants step two first. (Order matters!)");
    return ucSay("You say “glow” to no lantern in particular. The dark declines to cooperate.");
  }
  if(ucCh1Say(w)) return;
  if(S.room === "hall" && !S.doorOpen){
    if(w === "brave") return ucSay("“That’s MY word,” says the door. “Give me a DIFFERENT word that means the same thing.”");
    if(UC_BRAVE.indexOf(w) >= 0){
      S.doorOpen = true; ucSaveSoon();
      return ucSay("“<em>" + esc(w.toUpperCase()) + "</em>…” The door tastes the word, then grins ear to carved ear. “YES. THAT IS EXACTLY AS GOOD AS BRAVE.” It grinds open. The way <em>NORTH</em> is clear.");
    }
    return ucSay("The door thinks hard. “Nope. Not it. I want a word that means <em>BRAVE</em> — a hero word.”");
  }
  if(S.room === "gate" && S.lit && !S.done){
    if(/middle/.test(w)) return ucWin();
    return ucSay("The gate is silent. Maybe the answer is written down somewhere. (Scribble does love that green book.)");
  }
  ucSay("You say “" + esc(w) + "” out loud. The dungeon politely says it back: “<em>" + esc(w) + "</em>.” Echoes are free down here.");
}

function ucTalk(){
  var S = UC.S;
  if(ucCh1Talk()) return;
  if(S.room !== "nook") return ucSay("It’s just you and the stonework here. Scribble’s nook is off the echo hall.");
  S.metScribble++; ucSaveSoon();
  if(S.metScribble === 1) return ucGhost("Oh! A READER! Down HERE! Listen close, reader — to light a lantern the old way takes three steps, <em>in order</em>: ONE, put a glimmercap IN the lantern. TWO, shake the lantern. THREE, say GLOW. Order matters — it’s a recipe, not a pile.");
  if(S.metScribble === 2) return ucGhost("The Lantern Gate up north asks a question. The answer hides in that green book on my desk — READ it carefully. The good stuff usually hides in the middle of things… that’s all I’ll say.");
  S.metScribble = 0;
  return ucGhost("I have been dead four hundred years, and I have never ONCE returned a library book late. Standards, dear reader. Standards.");
}

function ucCross(rest){
  var S = UC.S, str = rest.join(" ");
  if(S.room !== "stair") return ucSay("Nothing to cross here. The flooded stair is north of the echo hall.");
  if(S.crossed && (!str || /crack|dry|pale/.test(str))){ ucMove("gate"); return; }
  if(/moss|green|wet/.test(str)){
    S.wetSock = true; ucSaveSoon();
    return ucSay("You step on a mossy tile. It sinks like it <em>planned this</em>. SPLOOSH. You scramble back to the steps, one sock soaked. Somewhere, the water giggles. (What did the warning on the wall say?)");
  }
  if(/crack|dry|pale|bone/.test(str)){
    S.crossed = true;
    ucSay("You hop from cracked tile to cracked tile — dry, dry, dry — and land on the far side. The water grumbles. It has been outsmarted by a crawler.");
    ucMove("gate");
    return;
  }
  ucSay("Which tiles — the <em>MOSSY</em> ones or the <em>CRACKED</em> ones? The wall’s warning might be a clue. (Try CROSS CRACKED TILES.)");
}

function ucGo(word){
  var S = UC.S, dir = UC_DIRS[word];
  if(!dir) return ucSys("Go where? Try GO NORTH, SOUTH, EAST, or WEST.");
  if(ucCh1Go(dir)) return;
  var r = UC_ROOMS[S.room], dest = r.exits[dir];
  if(!dest){
    var ways = Object.keys(r.exits).map(function(d){ return d.toUpperCase(); }).join(", ");
    return ucSay("You can’t go " + dir.toUpperCase() + " from here. Ways out: <em>" + ways + "</em>.");
  }
  if(S.room === "hall" && dir === "north" && !S.doorOpen) return ucSay("The stone door is shut. “A WORD THAT MEANS <em>BRAVE</em>,” it repeats, patiently. “SAY IT.”");
  if(S.room === "stair" && dir === "north" && !S.crossed) return ucSay("The water is between you and the far side. Which tiles will you trust — <em>MOSSY</em> or <em>CRACKED</em>? (Try CROSS CRACKED TILES.)");
  ucMove(dest);
}

function ucBag(){
  var S = UC.S;
  if(!S.bag.length) return ucSay("Your bag contains: one (1) sense of adventure.");
  ucSay("Your bag: <em>" + S.bag.map(esc).join("</em>, <em>") + "</em>." + (S.lit ? " The lantern is LIT and very proud." : ""));
}

function ucOpen(n){
  var S = UC.S;
  if(/door/.test(n || "") && S.room === "hall" && !S.doorOpen) return ucSay("You push. The door doesn’t budge. “Words, not muscles,” it says. “SAY a word that means BRAVE.”");
  if(/gate/.test(n || "") && S.room === "gate") return ucSay(S.lit ? "The gate opens for an answer, not for arms. It asked you a question — SAY the answer." : "Far too dark to find a handle. Light first.");
  if(/lantern/.test(n || "") && S.haveLantern) return ucSay(S.loaded ? "Its little door is shut snug around the glimmercap." : "Its little door already hangs open, hungry for something glowy.");
  ucSay("It’s either already open, or not the opening kind.");
}

function ucRun(raw){
  var toks = raw.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(function(t){ return t.length > 0 && t !== "please"; });
  if(!toks.length) return;
  UC.S.cmds++;
  ucLine("&gt; " + esc(raw), "ucecho");
  var v = UC_V2[toks[0]];
  var rest = toks.slice(1).filter(function(t){ return ["the","a","an","at","to","of","my","that","this"].indexOf(t) < 0; });
  if(!v && UC_DIRS[toks[0]] && toks.length === 1) return ucGo(toks[0]);
  if(v === "take" && rest[0] === "up") rest.shift();
  if(v === "talk" && (rest[0] === "to" || rest[0] === "with")) rest.shift();
  if(v === "cross" && rest[0] === "on") rest.shift();
  if(v === "go" && rest.length && /tile|crack|moss/.test(rest.join(" "))) return ucCross(rest);
  switch(v){
    case "look": return ucLookAt(rest.join(" ").replace(/^at /, ""));
    case "go": return ucGo(rest[0] || "");
    case "take": return ucTake(rest.join(" "));
    case "bag": return ucBag();
    case "use": return ucUse(rest.filter(function(t){ return t !== "on" && t !== "in" && t !== "into" && t !== "inside"; }));
    case "shake": return ucShake(rest.join(" "));
    case "say": return ucSayWord(rest.filter(function(t){ return t !== "on" && t !== "in"; }));
    case "talk": return ucTalk();
    case "read": return ucRead(rest.join(" "));
    case "cross": return ucCross(rest);
    case "open": return ucOpen(rest.join(" "));
    case "hint": return ucHint(false);
    case "help": return ucHelp();
  }
  var s2 = toks.join(" ");
  if(/^scribble$/.test(s2) && UC.S.room === "nook") return ucTalk();
  if(/lantern/.test(s2) && UC.S.room === "lamp" && !UC.S.haveLantern) return ucSys("(Did you mean TAKE LANTERN?)");
  if(/glow/.test(s2)) return ucSayWord(["glow"]);
  ucConfusedNow();
}

function ucBoot(){
  var sv = SS && SS.uc ? SS.uc.save : null;
  UC.T = []; UC.conf = 0; UC.idleFired = false;
  if(sv && sv.room && UC_ROOMS[sv.room]){
    UC.S = ucFresh();
    for(var k in UC.S) if(Object.prototype.hasOwnProperty.call(sv, k)) UC.S[k] = sv[k];
    if(!Array.isArray(UC.S.bag)) UC.S.bag = [];
    ucSys("UNDERCRAWL OS v0.1 · the terminal remembers you.");
    ucRoomLine();
  } else {
    UC.S = ucFresh();
    ucSys("UNDERCRAWL OS v0.1 · PROPERTY OF THE DUNGEON · NO REFUNDS");
    if(UC.why === "granted") ucSay("The Dungeon has taken a liking to you. This door creaked open <em>early</em>. Don’t tell the other doors.");
    else ucSay("You reached the Final Shelf — and the floor beneath it was never the bottom. Half-buried in dust, a brass terminal hums. It has been waiting a very long time.");
    ucSys("Type <em>HELP</em> anytime for the words I know · <em>HINT</em> if you’re stuck · the buttons below type the first word for you.");
    ucRoomLine();
    if(UC.tier === 1) ucSys("(Try <em>LOOK</em>, or <em>GO EAST</em>.)");
    ucSaveNow();
  }
}

var UC_CHIPS = ["LOOK","GO ","TAKE ","READ ","TALK TO ","SAY ","PUT ","SHAKE ","CROSS ","BAG","HINT","HELP"];
function ucSubmit(){
  var inp = document.getElementById("uccmd");
  if(!inp || !UC.S) return;
  var t = inp.value;
  if(!t.trim()) return;
  inp.value = "";
  ucRun(t);
  ucSaveSoon();
  ucArmIdle();
  inp.focus();
}
function ucMount(){
  var out = document.getElementById("ucout");
  var inp = document.getElementById("uccmd");
  if(!out || !inp) return;
  if(SS && SS.uc){ UC.tier = SS.uc.tier || 1; UC.why = SS.uc.why || null; }
  var bar = document.getElementById("ucchips");
  if(bar && !bar.childNodes.length){
    UC_CHIPS.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "ucchip"; b.textContent = c.trim();
      b.setAttribute("data-c", c);
      b.addEventListener("click", function(){
        if(c.slice(-1) === " "){ inp.value = c; inp.focus(); }
        else { inp.value = c; ucSubmit(); }
      });
      bar.appendChild(b);
    });
  }
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); ucSubmit(); } });
  if(!UC.S){ ucBoot(); }
  else { UC.T.forEach(function(row){
      var p = document.createElement("p");
      if(row[1]) p.className = row[1];
      p.innerHTML = row[0];
      out.appendChild(p);
    }); out.scrollTop = out.scrollHeight; }
  ucArmIdle();
  inp.focus();
}

function vUnder(){
  if(!SS){ loadState().then(function(s){ if(s) render(); }); return topbar() + '<div class="card"><span class="spin"></span> loading…</div>'; }
  if(SS.uc === undefined && route.who && SPIN[route.who]){
    SS.uc = null; /* restored straight onto the game screen: fetch the gate state */
    api.ucState(CODE, route.who, SPIN[route.who]).then(function(r){
      if(r && r.ok && SS){ SS.uc = r; } render();
    }).catch(function(){ if(SS) SS.uc = undefined; render(); });
  }
  if(SS.uc === null) return topbar() + '<div class="card"><span class="spin"></span> loading…</div>';
  if(!SS.uc || !SS.uc.open){
    return topbar('<button class="btn ghost small" data-a="ucback">← back to camp</button>')
      + '<div class="card"><h2>🚪 A sealed door</h2><div class="tiny">Something waits beneath the Final Shelf. Keep crawling — or maybe, someday, the Dungeon will open it for you.</div></div>';
  }
  return topbar('<button class="btn ghost small" data-a="ucback">🏕️ back to camp</button>')
    + '<div class="ucwrap">'
    + '<div class="uchead"><span class="uctitle">THE UNDERCRAWL</span><span class="ucsub">beneath the Final Shelf</span></div>'
    + '<div id="ucout" aria-live="polite"></div>'
    + '<div class="ucinrow"><span class="uccaret">&gt;</span>'
    + '<input id="uccmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here, then press ENTER" aria-label="Type a command">'
    + '<button class="btn small gold" data-a="ucgo">ENTER</button></div>'

    + '<div class="tiny" style="margin-top:6px;color:#9A96AE">Everything you type stays on this device — the dungeon reads it and forgets it.</div>'
    + '</div>';
}

/* ---------- wing logic ---------- */
function ucForgeQ(){
  var S = UC.S, t = S.v_forge || UC.tier || 1;
  if(S.forge_step === 0) return "First: “<em>TELE</em> MEANS FAR. <em>SCOPE</em> MEANS SEE. SAY THE TOOL THAT LETS YOU SEE FAR.”";
  if(S.forge_step === 1 && t >= 2) return "Next: “A <em>BIBLIOPHILE</em> IS A PERSON WHO ____ BOOKS. SAY THE MISSING WORD.”";
  if(S.forge_step === 2 && t >= 3) return "Last: “<em>AUTO</em> MEANS SELF. <em>BIO</em> MEANS LIFE. <em>GRAPH</em> MEANS WRITE. SAY THE WORD FOR A BOOK YOU WRITE ABOUT YOUR OWN LIFE.”";
  return "";
}
function ucForgeNeeds(){ var t = UC.S.v_forge || UC.tier || 1; return t >= 3 ? 3 : (t === 2 ? 2 : 1); }
function ucGauntQ(){
  var S = UC.S;
  if(!S.g1) return "Question one: “IN THE OLD TONGUE, WHAT DOES <em>BIBLIO</em> MEAN? SAY IT.”";
  if(!S.g2){
    var t = S.v_facts || UC.tier || 1;
    if(t === 1) return "Question two: “WHICH ANIMALS IN THE DEN BOTH HUNTED AT NIGHT? SAY ONE OF THEM.”";
    if(t === 2) return "Question two: “WHAT DID THE DOLPHINS AND BATS BOTH USE TO FIND FOOD? SAY IT.”";
    return "Question two: “WHAT DO SPIDERS AND SILKWORMS BOTH MAKE? SAY IT.”";
  }
  return "The slot glows green. The book in your bag has gone very still, the way you do before something big. (<em>RETURN BOOK</em> when you are ready.)";
}
function ucCh1Win(){
  var S = UC.S;
  S.ch1_done = true; S.haveBook = false;
  var i = S.bag.indexOf("the Overdue Book"); if(i >= 0) S.bag.splice(i, 1);

  ucSay("A brass stamp swings down: <em>KA-CHUNK.</em> The label glows: “Property of THE BOOKBINDER. Four hundred years overdue. Fine: one good reader. <em>PAID IN FULL.</em>”");
  ucSay("Somewhere far above, Scribble is absolutely NOT crying. “Four hundred years,” he sniffles, “and it comes home on YOUR library card.”");
  ucSys("✨ THE LIBRARY OF TEETH — CLEARED. " + S.cmds + " commands · " + S.hints + " hints · " + S.socks + " socks. CHAPTER TWO: <em>THE INK SEA</em> — still being written. You’ll be first aboard. (\u{1F3D5}️ back to camp up top, or keep wandering — the books like you now.)");
  ucSaveNow();
}

function ucCh1Say(w){ /* returns true if handled */

function ucGhostPoem(t){ ucLine("THE PURPLE BOOK: “" + t + "”", "ucghost"); }

  catch(e){ busy(btn, false); toast("Can't reach the server — try again"); return; }
  busy(btn, false);
  if(!res || !res.ok){ toast(res && res.err==="frozen" ? "🧊 The dungeon gate is frozen right now — " + (fam() ? "ask your grown-up!" : "ask your teacher!") : res && res.err==="none" ? "No boxes to open yet!" : "Hmm, that didn't work — try again"); loadState().then(()=>render()); return; }
  const st = BOOT && BOOT.students.find(s=>s.id===route.who);

    spawnBurst(ov, fx.colors, fx.parts);

/* AI pre-screen: quietly screen unscreened pending answers, one at a time.
   Silently stands down if the screening function isn't deployed. */
async function kickScreening(){
  if(DEMO || window.__aioff || window.__aibusy || !TD || !api.screenRead) return;
  if(TD.settings && TD.settings.verifyMode === "classic") return; /* Classic = no AI, ever */
  const targets = TD.reads.filter(r => r.status === "pending" && r.a && !r.ai).slice(0, 12);
  if(!targets.length) return;
  window.__aibusy = true;
  try{
    for(const r of targets){
      try{
        const v = await api.screenRead(r.id);
        if(v && v.v){
          r.ai = v;
          if(route.screen === "teacher" && route.tab === "queue" && !typing()) render();
        } else if(v && v.error){ window.__aioff = true; break; }
      }catch(e){ window.__aioff = true; break; }
    }
  } finally { window.__aibusy = false; }
}

function recheckHTML(r){
  if(!r.q || (TD && TD.settings && TD.settings.verifyMode === "classic")) return ""; /* Classic = no AI */
  const rc = r.ai && r.ai.recheck;

    return '<div class="aiv aiv-'+esc(rc.v)+'">🎤 '
      + (rc.v==="ok" ? "Spoken answer checks out" : rc.v==="mismatch" ? "Spoken answer doesn’t match either" : "Still can’t verify — your call")

    + '<textarea id="rc_'+r.id+'" rows="2" maxlength="800" placeholder="Type the gist of what they told you…"></textarea>'
    + '<button class="btn small primary" data-a="recheck" data-id="'+r.id+'">Check what they said</button></details>';

function tQueue(nlq, pq){
  const lvl = nlq.map(b=>{
    const waiting = TD.reads.filter(r=>r.bookId===b.id).map(r=>{const s=tstu(r.studentId); return s&&s.name;}).filter(Boolean);
    return '<div class="qcard"><div class="info"><strong>'+esc(b.title)+'</strong>'
      + '<div class="tiny">'+(b.pages||"?")+' pages · waiting: '+esc(waiting.join(", ")||"—")+'</div></div>'
      + '<a class="btn small ghost" target="_blank" rel="noopener" data-a="copytitle" data-t="'+esc(b.title)+'" href="https://www.google.com/search?q='+encodeURIComponent(b.title+' book lexile level')+'">\ud83d\udd0e Look it up</a>'
      + '<a class="btn small ghost" target="_blank" rel="noopener" data-a="copytitle" data-t="'+esc(b.title)+'" href="https://hub.lexile.com/find-a-book/">Lexile site</a>'
      + '<input class="inline-lvl" type="number" inputmode="numeric" placeholder="level" id="lvl_'+b.id+'">'
      + '<label class="tiny" style="display:inline-flex;align-items:center;gap:4px;margin:0 6px">🎨<input type="checkbox" id="gn_'+b.id+'" style="width:18px;height:18px" title="graphic novel / picture-heavy"></label>'
      + '<button class="btn small primary" data-a="savelevel" data-id="'+b.id+'">Save</button></div>';
  }).join("");
  const vmode = TD.settings.verifyMode;
  const reads = pq.slice().sort((a,b)=> a.date<b.date?-1:1).map(r=>{
    const st = tstu(r.studentId), b = tbook(r.bookId);
    const prior = TD.reads.filter(x=>x.studentId===r.studentId && x.bookId===r.bookId && x.id!==r.id).length;
    const sc = st && b ? Engine.score(Object.assign({},r,{status:"verified"}), b, st, TD.settings) : {state:"x"};
    return '<div class="qcard'+(r.flagged?" flagged":"")+'"><div class="info"><strong>'+esc(st?st.name:"?")+'</strong> finished <strong>'+esc(b?b.title:"?")+'</strong>'
      + (r.flagged ? ' <span class="chip spotchk">🎲 Spot check — book talk!</span>' : "")
      + '<div class="tiny">'+fmtDate(r.date)
      + (b && b.level==null ? ' · <span class="chip lvlwait">needs level first</span>' : (sc.state==="ok" ? " · will earn "+sc.total+" pts" : ""))
      + (prior ? ' <span class="chip reread">↺ re-read #'+(prior+1)+'</span>' : "") + '</div>'
      + (r.a ? '<div class="qanswer"><span class="tiny">'+esc(r.q||"Quest Report")+'</span><br>“'+esc(r.a)+'”'
          + (r.ai && r.ai.v ? '<div class="aiv aiv-'+esc(r.ai.v)+'">'
              + (r.ai.v==="ok" ? "✅ Checks out" : r.ai.v==="mismatch" ? "🚩 Doesn’t match — book talk?" : "🤔 Can’t verify — your call")
              + (r.ai.note ? ' <span class="tiny">· '+esc(r.ai.note)+'</span>' : "") + '</div>' : "")
          + recheckHTML(r)
          + '</div>' : "")
      + peersHTML(r)
      + '</div>'
      + (vmode && vmode!=="classic" ? '<button class="btn small ghost" data-a="toggleflag" data-id="'+r.id+'" title="'+(r.flagged?"Remove the spot-check flag":"Flag for a book talk")+'">'+(r.flagged?"🎲 Unflag":"🎲 Flag")+'</button>' : "")
      + '<button class="btn small good" data-a="verify" data-id="'+r.id+'">✓ Verify</button>'
      + '<button class="btn small ghost danger" data-a="delread" data-id="'+r.id+'" data-arm="1">Remove</button></div>';
  }).join("");
  return '<div class="stack">'
    + '<div class="card"><h2>Books that need a level ('+nlq.length+')</h2>'
    + '<div class="tiny" style="margin-bottom:8px">Look it up once (Lexile “Find a Book”, or the level printed in the book) — every future reader scores automatically.</div>'
    + (lvl || '<div class="tiny">Nothing waiting. 🎉</div>') + '</div>'
    + '<div class="card"><h2>Reads to verify ('+pq.length+')</h2>'
    + '<div class="tiny" style="margin-bottom:8px">'
    + (vmode==="report" ? "Read each Quest Report, then verify — spot-talk any that feel thin."
      : vmode==="report_spot" ? "Read the Quest Report and verify. 🎲 flagged reads get a real book talk first — the dungeon picks them at random, and you can flag any read yourself."
      : "A 2-minute book talk is plenty. Verify awards the points.")
    + '</div>'
    + (reads || '<div class="tiny">Queue clear.</div>') + '</div></div>';
}

/* 200L reading bands — entry is by band (de-identified), stored as the
   band's midpoint so every scoring path works unchanged */
const LEXBANDS = [
  {label:"BR–200L (early reader)", mid:100},
  {label:"200–400L", mid:300},
  {label:"400–600L", mid:500},
  {label:"600–800L", mid:700},
  {label:"800–1000L", mid:900},

function lexSel(id, cur, aria){
  const opts = LEXBANDS.map(b => {
    const sel = (cur != null && cur >= b.mid - 100 && cur < b.mid + 100) ? " selected" : "";
    return '<option value="' + b.mid + '"' + sel + '>' + b.label + '</option>';

/* ============ 📷 SCAN-A-BOOK — teacher/parent phones only ============
   Camera lives on phones (no Chromebook/desktop scanner — teachers use
   their phone); keyboards get a type-the-ISBN box with the same lookup.
   Decode is 100% on-device (native BarcodeDetector when present, else the
   bundled ZXing EAN reader). Only the 13 digits ever leave the phone:
   once to public book catalogs (title+pages), once to level_hint(). */
const SCAN_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent)); /* iPadOS masquerades as Mac */
function isbnClean(raw){
  let s = String(raw || "").replace(/[^0-9Xx]/g, "").toUpperCase();
  if(s.length === 10){ /* older books print ISBN-10 — convert */
    let sum = 0;
    for(let i = 0; i < 10; i++) sum += (s[i] === "X" ? 10 : +s[i]) * (10 - i);
    if(sum % 11 !== 0) return null;
    s = "978" + s.slice(0, 9);
    let c = 0;
    for(let i = 0; i < 12; i++) c += +s[i] * (i % 2 ? 3 : 1);
    return s + ((10 - c % 10) % 10);
  }
  if(/X/.test(s)) return null;
  if(s.length === 12) s = "0" + s; /* raw UPC-A → EAN-13 shape */
  if(s.length !== 13) return null;
  let c = 0;
  for(let i = 0; i < 13; i++) c += +s[i] * (i % 2 ? 3 : 1);
  return c % 10 === 0 ? s : null;
}
const isbnBookland = (s) => /^97[89]/.test(s);
async function isbnLookup(isbn){
  const g = withTimeout(
    fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn).then(r => r.json()), 8000
  ).then(j => {
    const v = j && j.items && j.items[0] && j.items[0].volumeInfo;
    return v ? {title: v.title || "", pages: v.pageCount || null} : null;
  }).catch(() => null);
  const o = withTimeout(
    fetch("https://openlibrary.org/isbn/" + isbn + ".json").then(r => r.ok ? r.json() : null), 8000
  ).then(j => j ? {title: j.title || "", pages: j.number_of_pages || null} : null).catch(() => null);
  const [gr, or] = await Promise.all([g, o]);
  if(!gr && !or) return null;
  return {title: (gr && gr.title) || (or && or.title) || "",
          pages: (gr && gr.pages) || (or && or.pages) || null};
}
function scanBeep(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const osc = a.createOscillator(), gn = a.createGain();
    osc.frequency.value = 880; gn.gain.value = 0.12;
    osc.connect(gn); gn.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + 0.12);
    setTimeout(() => a.close(), 400);
  }catch(e){}
}

async function scanResolve(isbn){ /* digits → full result object */
  const dup = (TD && TD.books || []).find(b => b.isbn === isbn);
  if(dup) return {isbn, already: dup.title};
  const [found, hint] = await Promise.all([isbnLookup(isbn), api.levelHint(isbn)]);
  const r = {isbn, title: found ? found.title : "", pages: found ? found.pages : null,
             hint: hint || null, notFound: !found};
  if(r.title){
    const norm = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const d = (TD && TD.books || []).find(b => norm(b.title) === norm(r.title));
    if(d) r.dupTitle = d.title;
  }
  return r;
}

async function scanFrame(source, w, h){ /* → digits | null, on-device */
  const cv = document.createElement("canvas");
  const scale = Math.min(1, 900 / w);
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  cv.getContext("2d").drawImage(source, 0, 0, cv.width, cv.height);
  if(scanS && scanS.native){
    try{
      const hits = await scanS.native.detect(cv);
      if(hits && hits[0] && hits[0].rawValue) return hits[0].rawValue;
    }catch(e){}
  }
  if(window.__decodeBarcode){
    try{ return window.__decodeBarcode(cv.getContext("2d").getImageData(0, 0, cv.width, cv.height)); }catch(e){}
  }
  return null;
}
async function scanTick(){
  if(!scanS || scanS.busy) return;
  const v = document.getElementById("scanvid");
  if(!v || !v.videoWidth) return;
  scanS.busy = true;
  try{
    const digits = await scanFrame(v, v.videoWidth, v.videoHeight);
    if(digits) await scanFound(digits);
  }finally{ if(scanS) scanS.busy = false; }
}
async function scanFound(digits){
  const isbn = isbnClean(digits);
  if(!isbn) return;
  if(scanS && scanS.timer){ clearInterval(scanS.timer); scanS.timer = null; }
  scanBeep();
  if(!isbnBookland(isbn)){
    scanMsg("That’s a store barcode, not the book code — find the one starting 978 (often inside the front cover).");
    scanResume(2600); return;
  }
  scanMsg("Got it — looking up " + isbn + "…");
  const box = document.getElementById("scanres");
  if(box) box.innerHTML = scanResHTML({busy: true});
  const r = await scanResolve(isbn);
  if(r.already){
    scanMsg("✔ Already in your library: " + r.already + " — keep scanning.");
    if(box) box.innerHTML = "";
    scanResume(2200); return;
  }
  scanMsg("Check it, tweak it, add it — then scan the next one.");
  if(box) box.innerHTML = scanResHTML(r);
}
function scanResume(delay){
  setTimeout(() => {
    if(scanS && !scanS.timer && document.getElementById("scanov")){
      scanMsg("Point at the barcode on the back cover…");
      scanS.timer = setInterval(scanTick, 380);
    }
  }, delay || 0);
}
async function scanSnapFile(file){
  if(!file) return;
  scanMsg("Reading the photo…");
  try{
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const digits = await scanFrame(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(url);
    if(digits) await scanFound(digits);
    else scanMsg("Couldn’t read that photo — get closer, flatter, brighter and try again.");
  }catch(e){ scanMsg("Couldn’t read that photo — try again."); }
}

async function isbnTyped(raw){
  const isbn = isbnClean(raw);
  if(!isbn){ toast("That doesn’t look like a full ISBN"); return; }
  if(!isbnBookland(isbn)){ toast("Book ISBNs start 978 — check under the barcode"); return; }
  scanInline = {busy: true}; render();
  const r = await scanResolve(isbn);
  scanInline = r.already ? {err: "✔ Already in your library: " + r.already} : r;
  render();
}
async function scanCommit(host, isbn){
  const g = (id) => host.querySelector(id);
  const title = (g("#sr_title") && g("#sr_title").value || "").trim();
  if(!title){ toast("Title first"); return null; }
  const pages = parseInt(g("#sr_pages") && g("#sr_pages").value, 10) || null;
  const level = parseInt(g("#sr_level") && g("#sr_level").value, 10) || null;
  const fmt = (g("#sr_gn") && g("#sr_gn").checked) ? "gn" : null;
  try{
    await api.addBook(titleCase(title), level, pages, isbn || null, fmt);
    toast("⚔️ " + title + " added");
    return true;
  }catch(e){ toast(e.message); return null; }
}

/* ---- exports (real downloads on a real site) ---- */
async function dl(name, text){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const d = await window.claude.use("downloads");
      if(d){
        try{ await d.save({filename:name, data:text}); toast("Saved "+name); return; }
        catch(err){
          if(err && err.code === "extension_not_enabled" && /\.csv$/.test(name)){
            try{ await d.save({filename:name.replace(/\.csv$/, ".txt"), data:text}); toast("Saved as .txt"); return; }catch(e2){}
          } else if(err && err.code === "declined"){ toast("Canceled"); return; }
        }
      }
    }
  }catch(e){}
  const blob = new Blob([text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

  });
  return [head].concat(rows).join("\n");
}

      t.earned, t.rolls, t.yearTier||""].map(csvCell).join(",");
  });
  return [head].concat(rows).join("\n");
}

/* ---- year-end ceremony (teacher, projector) ---- */
let CER = null;
function tierIdxFor(pts, tiers){ let idx = -1; tiers.forEach((t,i)=>{ if(pts >= t.pts) idx = i; }); return idx; }
function startCeremony(){
  if(!TD || !TD.students.length){ toast("No crawlers yet"); return; }
  const tiers = TD.settings.yearTiers.slice().sort((a,b)=>a.pts-b.pts);
  const list = TD.students.map(st=>{
    const t = Engine.totals(st.id, TD);
    return {name:st.name, pts:t.pts, books:t.verified, best:t.best, ti:tierIdxFor(t.pts, tiers)};
  }).sort((a,b)=> (a.ti - b.ti) || (a.pts - b.pts));
  CER = {list, tiers, i:-1};
  const ov = document.createElement("div");
  ov.className = "ceremony"; ov.id = "cereov";
  document.body.appendChild(ov);
  renderCeremony();
}
function endCeremony(){ document.getElementById("cereov")?.remove(); CER = null; }
function renderCeremony(){
  const ov = document.getElementById("cereov");
  if(!ov || !CER) return;
  const N = CER.list.length;
  const CCOLORS = [["#EAD5C0","#B98554","#FFFFFF"],["#E8E8EE","#9C9CB0","#FFFFFF"],["#F5CF7E","#E8A33D","#FFFFFF"],["#9FE0DC","#DDF0EE","#FFFFFF"],["#7FE3E0","#F5CF7E","#FFFFFF","#C9B5F0"]];
  if(CER.i === -1){
    ov.innerHTML = '<div class="cerewrap"><div class="cerekicker">'+esc(TD.settings.className||"")+'</div>'
      + '<div class="cerename">THE YEAR-END<br>CEREMONY</div>'
      + '<div class="cerestats">'+N+' crawlers \u00b7 one year \u00b7 every box guaranteed</div>'
      + '<div class="cerectl"><button class="btn gold big" style="width:auto" data-a="cerenext">Begin \u2192</button>'
      + '<button class="btn ghost" data-a="cereexit">Exit</button></div></div>';
    return;
  }
  if(CER.i >= N){
    const totB = CER.list.reduce((a,x)=>a+x.books,0), totP = CER.list.reduce((a,x)=>a+x.pts,0);
    const deep = CER.list.reduce((a,x)=>Math.max(a, pfloorOf(x.pts)), 1);
    ov.innerHTML = '<div class="cerewrap"><div class="cerekicker">THE CRAWL IS COMPLETE</div>'
      + '<div class="cerename">'+totB+' BOOKS</div>'
      + '<div class="cerestats">'+totP+' points as a '+(fam()?'crew':'class')+' \u00b7 the deepest crawler reached FLOOR '+deep+': '+esc(PFLOORS[deep-1].name)+'</div>'
      + '<div class="cerestats" style="font-style:italic">Well fought, crawlers. The dungeon will remember you.</div>'
      + '<div class="cerectl"><button class="btn gold" data-a="cereexit">End ceremony</button></div></div>';
    spawnBurst(ov, ["#F5CF7E","#E8A33D","#A79BE0","#7FE3E0","#FFFFFF"], 160);
    return;
  }
  const c = CER.list[CER.i];
  const tier = c.ti >= 0 ? CER.tiers[c.ti] : null;
  const last = CER.i === N - 1;
  const boxHtml = tier
    ? '<div class="cerebox yt'+Math.min(c.ti,4)+(c.ti>=4?" pulse":"")+'">'+esc(tier.name).toUpperCase()+'</div>'
    : '<div class="cerebox none">HONORARY CRAWLER \u2014 every floor was walked</div>';
  ov.innerHTML = '<div class="cerecount">'+(CER.i+1)+' / '+N+'</div>'
    + '<div class="cerewrap"><div class="cerekicker">'+(c.ti>=4?"AGAINST ALL ODDS":"THE VAULT OPENS FOR")+'</div>'
    + '<img class="cereav" alt="" src="'+avatarFor(c.name)+'">'
    + '<div class="cerename">'+esc(c.name)+'</div>'
    + '<div class="cerestats">'+c.books+' book'+(c.books===1?"":"s")+' \u00b7 '+c.pts+' points'
    + (c.best!=null && c.best>0 ? ' \u00b7 biggest stretch '+c.best+'L' : '')+'</div>'
    + boxHtml
    + '<div class="cerectl"><button class="btn gold" data-a="cerenext">'+(last?"The finale \u2192":"Next crawler \u2192")+'</button>'
    + '<button class="btn ghost" data-a="cereexit">Exit</button></div></div>';
  const colors = c.ti >= 0 ? CCOLORS[Math.min(c.ti,4)] : ["#B9B3D1","#7C76A0"];
  spawnBurst(ov, colors, c.ti >= 4 ? 160 : c.ti >= 0 ? 60 + c.ti*25 : 24);
}

document.addEventListener("keydown", async (ev)=>{
  if(CER){
    if(ev.key === " " || ev.key === "ArrowRight"){ ev.preventDefault(); CER.i++; renderCeremony(); return; }
    if(ev.key === "Escape"){ endCeremony(); return; }
  }
  if(route.screen === "code" && ev.key === "Enter"){ $('[data-a="entercode"]')?.click(); return; }
  if(route.screen === "tauth" && ev.key === "Enter"){
    const ae = document.activeElement;
    if(ae && ae.tagName === "TEXTAREA") return;
    /* Enter in the email field with an empty password moves to the password
       field instead of submitting a half-filled form */
    if(ae && ae.id === "t_email"){
      const p = $("#t_pass");
      if(p && !p.value){ p.focus(); return; }
    }
    const btn = authMode === "up" ? "tsignup"
      : authMode === "forgot" ? "tforgot"
      : authMode === "reset" ? "tsetpass"
      : "tsignin";
    $('[data-a="' + btn + '"]')?.click();
    return;
  }
  if(route.screen !== "pin") return;
  if(/^[0-9]$/.test(ev.key)){ if(pinBuf.length<4){ pinBuf+=ev.key; if(pinBuf.length===4){ await tryPin(); return; } render(); } }
  else if(ev.key==="Backspace"){ pinBuf = pinBuf.slice(0,-1); render(); }
  else if(ev.key==="Enter" && pinBuf.length===4) await tryPin();
});

/* ---- boot ---- */
(async function init(){
  if(!DEMO && /type=recovery/.test(location.hash)){ authMode = "reset"; route.screen = "tauth"; }
  let oauthErr = null, oauthPending = null;
  try{
    const hs = new URLSearchParams((location.hash || "").replace(/^#/, "")), qs = new URLSearchParams(location.search);
    oauthErr = hs.get("error_description") || qs.get("error_description");
    oauthPending = sessionStorage.getItem("bc_oauth"); sessionStorage.removeItem("bc_oauth");
  }catch(e){}
  if(oauthErr && route.screen !== "teacher") route.screen = "tauth";
  if(route.screen==="teacher" || route.screen==="tauth"){
    let sess = null;
    try{ sess = await api.teacherSession(); authOk(); }
    catch(e){ if(authRecover()) return; }
    if(!sess){
      route.screen = "tauth";
      if(oauthPending || oauthErr){
        authMode = "in";
        const why = oauthErr ? "Sign-in didn\u2019t finish: " + String(oauthErr).replace(/\+/g, " ").slice(0, 160) : "Sign-in didn\u2019t finish \u2014 try again, or use email and password";
        setTimeout(function(){ toast(why); }, 400);
      }
    }
    /* tidy the address bar after a Google/Microsoft round trip (never during a password reset) */
    if(!/type=recovery/.test(location.hash) && /access_token|error/.test(location.hash + location.search)){
      try{ history.replaceState(null, "", location.pathname); }catch(e){}
    }
  } else if(route.screen==="home" || route.screen==="log" || route.screen==="char"){
    if(!route.who || !SPIN[route.who]) route.screen = CODE ? "gate" : "code";
    else await ensureBoot();
  } else if(route.screen==="descent"){
    if(!CODE) route.screen = "code";
    else await ensureBoot();
  } else if(route.screen!=="code" && !CODE){
    route.screen = "code";
  }
  render();
})();

/* ============================================================
   DUNGEON BACKDROP — procedural pixel art, painted once per
   load/resize/theme. Original blocky art, no image assets.
   ============================================================ */
function bgEnabled(){ try{ return localStorage.getItem("bc_bg") !== "0"; }catch(e){ return true; } }
function isDarkTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintDungeon(){
  const cv = document.getElementById("dungeonbg");
  const glow = document.getElementById("dungeonglow");
  if(!cv) return;
  if(!bgEnabled()){ cv.style.display = "none"; if(glow) glow.style.display = "none"; return; }
  cv.style.display = ""; if(glow) glow.style.display = "";
  const dark = isDarkTheme();
  const scale = 4;                               // 1 art pixel = 4 screen px
  const W = Math.ceil(window.innerWidth / scale);
  const H = Math.ceil(window.innerHeight / scale);
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const R = (n) => Math.floor(Math.random() * n);
  const P = dark ? {
    stones:["#282344","#2E2950","#332D58","#252041"], mortar:"#1C1836",
    moss:"#31513C", crack:"#171331", floor:"#1F1B3C",
    shelf:"#4A3524", spine:["#B34A44","#3F7E5A","#3E5F9E","#B08A3E","#7C4E9E","#9E9E9E"],
    chest:"#5C4126", chestband:"#C9A23F", stick:"#6B4A2B",
    flame1:"#FFB347", flame2:"#FFE08A",
    glowA:"rgba(255,170,60,.16)", glowB:"rgba(255,170,60,0)",
    vin:"rgba(8,6,20,.42)"
  } : {
    stones:["#E3DFD4","#DCD7CA","#D5CFC1","#E8E4DA"], mortar:"#C7C0B1",
    moss:"#B5C9A8", crack:"#BDB5A3", floor:"#D8D2C4",
    shelf:"#B08A62", spine:["#D98B85","#8FBF9F","#8FA8D9","#D9BC7A","#B195CF","#BFBFBF"],
    chest:"#B98F5D", chestband:"#D9B85C", stick:"#A57B4F",
    flame1:"#FFB347", flame2:"#FFE9A8",
    glowA:"rgba(255,190,90,.14)", glowB:"rgba(255,190,90,0)",
    vin:"rgba(120,105,80,.14)"
  };
  // floor theme override — the signed-in crawler's own depth colors the walls
  try{
    const pf = (SS && route.who) ? pfloorOf(SS.pts) : 1;
    const ovp = palForFloor(pf);
    if(ovp) Object.assign(P, dark ? ovp.dark : ovp.light);
  }catch(e){}
  // stone bricks
  const bh = 9, bw = 20;
  for(let row = 0; row * bh < H; row++){
    const off = (row % 2) ? bw/2 : 0;
    for(let col = -1; col * bw < W + bw; col++){
      const bx = col * bw + off, by = row * bh;
      x.fillStyle = P.mortar; x.fillRect(bx, by, bw, bh);
      x.fillStyle = P.stones[R(P.stones.length)];
      x.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
      if(R(10) === 0){ x.fillStyle = P.moss; x.fillRect(bx + 2 + R(10), by + bh - 3, 3 + R(4), 2); }
      if(R(14) === 0){ x.fillStyle = P.crack; x.fillRect(bx + 3 + R(8), by + 2, 1, 3 + R(3)); }
    }
  }
  // floor strip
  x.fillStyle = P.floor; x.fillRect(0, H - 6, W, 6);
  // torches along an upper band
  const torches = [];
  const gap = Math.max(70, Math.floor(W / Math.max(2, Math.floor(W / 90))));
  for(let tx = Math.floor(gap / 2); tx < W; tx += gap){
    const ty = 18 + R(6);
    torches.push([tx, ty]);
    x.fillStyle = P.stick; x.fillRect(tx, ty + 3, 2, 6);
    x.fillStyle = P.flame1; x.fillRect(tx - 1, ty, 4, 3);
    x.fillStyle = P.flame2; x.fillRect(tx, ty - 2, 2, 3);
  }
  // furniture along the lower half: bookshelves and chests
  const items = 2 + Math.floor(W / 150);
  for(let i = 0; i < items; i++){
    const ix = 10 + R(Math.max(20, W - 40));
    const iy = H - 8;

/* deterministic pixel avatar from crawler name (nothing stored) */
const _avCache = {};
function avatarFor(name){
  if(_avCache[name]) return _avCache[name];
  let h = 2166136261 >>> 0;
  for(const ch of String(name)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h = Math.imul(h ^ (h>>>15), 2246822519) >>> 0; h = Math.imul(h ^ (h>>>13), 3266489917) >>> 0; return ((h ^= h>>>16) >>> 0) / 4294967296; };
  const hue = Math.floor(rnd() * 360);
  const base = "hsl(" + hue + ",62%,52%)", acc = "hsl(" + ((hue + 150) % 360) + ",70%,58%)";
  const c = document.createElement("canvas"); c.width = 8; c.height = 8;
  const x = c.getContext("2d");
  for(let ry = 0; ry < 8; ry++) for(let rx = 0; rx < 4; rx++){
    const v = rnd();
    if(v > 0.52){ x.fillStyle = v > 0.86 ? acc : base; x.fillRect(rx, ry, 1, 1); x.fillRect(7 - rx, ry, 1, 1); }
  }
  x.fillStyle = base; x.fillRect(2, 2, 4, 3);           // face
  x.fillStyle = "#191625"; x.fillRect(2, 3, 1, 1); x.fillRect(5, 3, 1, 1);  // eyes
  if(rnd() > 0.5){ x.fillRect(3, 4, 2, 1); }            // mouth sometimes
  x.fillStyle = base; x.fillRect(2, 7, 1, 1); x.fillRect(5, 7, 1, 1);       // feet
  return (_avCache[name] = c.toDataURL());
}
function avImg(name, cls){ return '<img class="avatarimg' + (cls ? " " + cls : "") + '" alt="" src="' + avatarFor(name) + '">'; }



/* ============================================================
   THE DESCENT BOARD — one shared shaft, every crawler's avatar
   sitting at their own floor. Cosmetic-narrative only.
   ============================================================ */
let __desc = null;
function paintDescent(){
  const cv = document.getElementById("descmap");
  if(!cv || !__desc) return;
  const dark = isDarkTheme();
  const RH = 16, DH = 12, W = 160, N = PFLOORS.length;
  cv.width = W; cv.height = N * RH + DH;
  const x = cv.getContext("2d");
  let seed = 77;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const BASE = dark
    ? {stones:["#282344","#2E2950","#332D58","#252041"], mortar:"#1C1836", moss:"#31513C", floor:"#1F1B3C"}
    : {stones:["#DCD8EA","#D2CEE4","#C8C2DC","#E4E0F0"], mortar:"#B9B4D0", moss:"#9BB89B", floor:"#CFCAE2"};
  const SPINES = ["#B34A44","#3F7E5A","#3E5F9E","#B08A3E","#7C4E9E"];
  for(let i = 0; i < N; i++){
    const fn = i + 1;
    const ovp = palForFloor(fn);
    const pal = ovp ? (dark ? ovp.dark : ovp.light) : BASE;
    const y0 = i * RH;
    const locked = fn > __desc.reveal;
    x.fillStyle = pal.mortar; x.fillRect(0, y0, W, RH);
    for(let r = 0; r < RH - 5; r += 5){
      const off = (r / 5) % 2 ? 4 : 0;
      for(let c0 = -4; c0 < W; c0 += 8){
        x.fillStyle = pal.stones[Math.floor(rnd() * pal.stones.length)];
        x.fillRect(c0 + off, y0 + r, 7, 4);
      }
    }
    x.fillStyle = pal.floor; x.fillRect(0, y0 + RH - 5, W, 5);
    x.fillStyle = "rgba(0,0,0,.25)"; x.fillRect(0, y0 + RH - 6, W, 1);
    if(!locked){
      for(let m = 0; m < 8; m++){ x.fillStyle = pal.moss; x.fillRect(Math.floor(rnd()*W), y0 + Math.floor(rnd()*(RH-7)), 2, 1); }
      x.fillStyle = "#4A3524"; x.fillRect(6, y0 + RH - 12, 14, 7);
      for(let b = 0; b < 4; b++){ x.fillStyle = SPINES[(i + b) % SPINES.length]; x.fillRect(8 + b*3, y0 + RH - 10, 2, 4); }
      [W - 26, W - 12].forEach(t => {
        x.fillStyle = "#6B4520"; x.fillRect(t, y0 + 7, 2, 4);
        x.fillStyle = "#E8A33D"; x.fillRect(t, y0 + 5, 2, 2);
        x.fillStyle = "#F5CF7E"; x.fillRect(t, y0 + 4, 2, 1);
      });
    } else {
      x.fillStyle = dark ? "rgba(6,4,16,.78)" : "rgba(40,34,70,.55)";
      x.fillRect(0, y0, W, RH);
      for(let d = 0; d < 110; d++){ x.fillStyle = "rgba(0,0,0,.5)"; x.fillRect(Math.floor(rnd()*W), y0 + Math.floor(rnd()*RH), 2, 1); }
    }
  }
  const yD = N * RH;
  x.fillStyle = dark ? "#070512" : "#1A1530"; x.fillRect(0, yD, W, DH);
  x.fillStyle = "#2A2348";
  for(let g = 4; g < W; g += 10){ x.fillRect(g, yD, 2, DH); }
}
function _nmHash(t){ let h = 0; for(let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) & 0xffff; return h; }
/* crew: [{name, equipped, floor, me}] — floor numbers only, never points */

function vDescent(){

  if(who && !SS){ loadState().then(()=>render()); }
  const me = who && BOOT.students.find(s => s.id === route.who);
  const FP = floorPtsPer();
  const mf = (who && SS) ? pfloorOf(SS.pts) : null;
  const shown = trackerOn();
  let crew = [];
  if(shown){
    crew = (BOOT.students || []).filter(s => s.floor).map(s => ({
      name: s.name, equipped: s.equipped, floor: Math.min(PFLOORS.length, s.floor),
      me: !!(me && s.id === me.id)}));
    if(me && mf){

      if(mine) mine.floor = mf;

    }

    + C("Payments", "Cards are processed by Stripe on Stripe’s own pages. We never see or store card numbers — we only record that a dungeon’s season pass is paid, and until when.")
    + C("The AI reading check", "When a class uses Quest Reports, the child’s answer, the question, and the book’s title and page count are sent to our AI provider (Anthropic) for one purpose: generating the private advisory hint the teacher sees (✅/🤔/🚩). For a 🎤 re-check, the teacher’s typed summary of what the child said aloud takes the place of the written answer. <strong>No student identifiers travel with it</strong> — not even the dungeon name — and under its commercial API terms Anthropic does not use that text to train AI models. Every check is processed in the United States (we require Anthropic\u2019s US-only processing option), and Anthropic deletes API inputs and outputs within 30 days (longer only if a request is flagged for a safety review). The hint is stored with the reading log; the AI never grades, blocks, or messages a child. A class that prefers no AI at all can use Classic verification, which sends nothing to Anthropic.")
    + C("Our service providers", "A short list of companies helps run Book Crawl, each seeing only what its job requires: <strong>Supabase</strong> hosts the database and adult sign-ins; <strong>Google</strong> and <strong>Microsoft</strong> confirm who you are only if you choose to sign in with them — they learn you signed in to Book Crawl, never anything about your class or students; <strong>Anthropic</strong> receives quest-report text for the advisory hint (details above); <strong>Stripe</strong> handles payments and only ever deals with adults; <strong>GitHub Pages</strong> serves the game’s code and stores no game data at all; account emails (like sign-up confirmations and password resets) are sent through <strong>Amazon Web Services</strong> (Amazon SES) from servers in the United States. The same service carries Book Crawl\u2019s own operator alerts to our inbox (new feedback, a weekly usage summary), which can include a grown-up\u2019s email address, class names and codes, and what they wrote in the feedback box (which asks them to leave out students\u2019 names) \u2014 never student records. When an adult scans or types a book’s barcode, the decoding happens on their own device and the lookup sends only that ISBN to public book catalogs (Google Books, Open Library) — never anything about students. None of these companies may use this data for anything besides providing their service to us, and none of it is ever used for advertising.")
    + C("Cookies & tracking", "Book Crawl sets no advertising or analytics trackers. Your browser keeps only what the game needs to work: your sign-in session, your class code, and small conveniences like which device already saw a welcome screen.")
    + C("Who can see what", "Each class or crew is walled off from every other by database-level security. You see only your own dungeon. Kids see their classmates’ dungeon names, avatars, and floor numbers (if the tracker is on) — never anyone’s points or reading details. If a security incident ever affected your class or crew’s data, you would be notified at your account email without unreasonable delay \u2014 no later than 72 hours after we confirm it \u2014 with what happened, what it touched, and what we’re doing about it. Schools and districts with a signed data agreement are also notified the way that agreement requires.")
    + C("Retention & deletion", "You can delete a student or a book yourself at any moment, and it’s gone; to delete a whole class, just ask. Classroom data is <strong>season-scoped</strong>: when a teacher wraps up a school year, one button (Settings \u2192 \ud83c\udf42 Season) clears the class’s crawler data — names, logs, points, gear — for a fresh start, so prior-year classroom records don’t carry forward. Deleted or cleared data leaves the live database at once and our automatic backups within 7 days. The class library of books and levels carries over, so next year’s readers inherit a leveled shelf. Family crews are the exception: a family’s data stays until the parent deletes it. Accounts inactive for 24 months are deleted entirely, after email reminders. A frozen dungeon is kept, not deleted. To delete a class, your account, or everything in it, just ask" + (BC_CONTACT ? " at the address below" : " through the site") + ".")

}
function tMap(){
  const FP = floorPtsPer();
  const crew = TD.students.map(st => {
    const t = Engine.totals(st.id, TD);
    return {name: st.name, equipped: st.equipped, floor: Math.min(PFLOORS.length, 1 + Math.floor(Math.max(0, t.pts) / FP))};
  });
  const reveal = crew.reduce((a, c) => Math.max(a, c.floor), 1);
  const deepest = crew.filter(c => c.floor === reveal).map(c => c.name);
  const books = TD.reads.filter(r => r.status === "verified").length;
  return '<div class="stack">'
    + '<div class="card"><h2>🗺️ The Descent</h2>'
    + '<div class="tiny" style="margin-bottom:8px">Every crawler digs their own path — one floor per ' + FP + ' points. Hover any crawler for their name. '
    + (trackerOn() ? 'The kids see this same board.' : 'The kids’ board is hidden right now (Settings → Class tracker).') + '</div>'
    + '<div class="label">DEEPEST — FLOOR ' + reveal + ' · ' + esc(PFLOORS[reveal - 1].name) + '</div>'
    + '<div class="tiny" style="font-style:italic;margin:2px 0 8px">' + esc(PFLOORS[reveal - 1].lore) + ' · down there: ' + esc(deepest.join(", ") || "—") + ' · ' + books + ' quests verified</div>'
    + '</div>'
    + descentHTML(crew, 0, reveal)
    + '</div>';
}

/* particle burst — pixel squares, one-shot */
function spawnBurst(host, colors, count){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.className = "fx"; cv.width = window.innerWidth; cv.height = window.innerHeight;
  host.appendChild(cv);
  const x = cv.getContext("2d");
  const cx = cv.width / 2, cy = cv.height / 2 - 60;
  const ps = [];
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
    ps.push({x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 4, s:3 + Math.random()*5,
             c:colors[Math.floor(Math.random()*colors.length)], life:50 + Math.random()*35});
  }
  let frame = 0;
  (function tick(){
    frame++;
    x.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    for(const p of ps){
      if(frame > p.life) continue;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.vx *= 0.99;
      x.globalAlpha = Math.max(0, 1 - frame / p.life);
      x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s);
    }
    x.globalAlpha = 1;
    if(alive) requestAnimationFrame(tick); else cv.remove();
  })();
}

/* floor-descent moment (YOU reached a new floor since this device last looked) */
function checkFloorEvent(){
  if(!SS || !route.who) return;
  const f = pfloorOf(SS.pts);
  const key = "bc_pfloor_" + route.who;
  let prev = null;
  try{ prev = localStorage.getItem(key); }catch(e){}
  if(prev !== null && f > Number(prev)){
    const fl = PFLOORS[f - 1];
    const ov = document.createElement("div");
    ov.className = "overlay"; ov.id = "floorov";
    ov.innerHTML = '<div class="floorbanner"><div class="f1">YOU DESCEND, CRAWLER…</div>'
      + '<div class="f2">FLOOR ' + f + '</div>'
      + '<div class="f1" style="margin-top:6px">' + esc(fl.name) + '</div>'
      + '<div class="f3">' + esc(fl.lore) + '</div>'
      + '<div style="margin-top:18px"><button class="btn gold" data-a="closefloor">Onward!</button></div></div>';
    document.body.appendChild(ov);
    spawnBurst(ov, ["#F5CF7E","#E8A33D","#A79BE0","#FFFFFF"], 90);
    paintDungeon();
  }
  try{ localStorage.setItem(key, String(f)); }catch(e){}
}
/* level-up moment (per student, per device) */

  if(!SS || !route.who) return;
  const key = "bc_lvl_" + route.who;

function drawGearItem(x, id){
  const def = GEAR[id]; if(!def || !def[3]) return;
  const [ , , , shape, c] = def;
  const F = (col, px, py, w, h) => { x.fillStyle = col; x.fillRect(px, py, w, h); };
  switch(shape){
    case "cap":    F(c[0],4,2,8,2); F(c[1],3,4,10,1); break;
    case "helm":   F(c[0],4,1,8,3); F(c[1],4,4,8,1); F("#1c1c2e",6,3,1,1); F("#1c1c2e",9,3,1,1); break;
    case "hood":   F(c[0],5,0,6,1); F(c[0],4,1,8,2); F(c[1],3,3,10,1); break;
    case "pointy": F(c[0],7,0,2,1); F(c[0],6,1,4,1); F(c[0],5,2,6,1); F(c[1],3,3,10,1); break;
    case "twigs":  F(c[0],4,3,8,1); F(c[1],5,1,1,2); F(c[1],8,0,1,3); F(c[1],11,1,1,2); break;
    case "horned": F(c[0],4,2,8,2); F(c[1],2,0,2,3); F(c[1],12,0,2,3); break;
    case "crown":  F(c[0],4,2,8,2); F(c[1],4,0,1,2); F(c[1],7,0,2,2); F(c[1],11,0,1,2); break;
    case "halo":   F(c[0],4,0,8,1); F(c[1],4,0,1,1); F(c[1],8,0,1,1); F(c[1],11,0,1,1); break;
    case "sword":  F(c[1],13,10,2,1); F(c[0],13,4,1,6); break;
    case "torch":  F(c[0],13,7,1,4); F(c[1],12,4,3,3); F(c[2],13,3,1,2); break;
    case "quill":  F(c[0],13,4,1,6); F(c[1],12,4,2,2); break;
    case "axe":    F(c[0],13,5,1,6); F(c[1],11,3,3,3); break;
    case "staff":  F(c[0],13,5,1,7); F(c[1],12,3,3,3); F("#FFFFFF",13,4,1,1); break;
    case "blade":  F(c[1],13,9,2,1); F(c[0],13,3,1,6); F(c[1],12,4,1,2); break;
    case "scepter":F(c[0],13,5,1,7); F(c[1],11,2,4,1); F(c[1],12,3,2,2); F("#FFFFFF",13,1,1,1); break;
    case "cloak":  F(c[0],1,5,3,7); F(c[1],1,11,3,1); break;
    case "pack":   F(c[0],1,6,3,4); F(c[1],1,7,3,1); break;
    case "cape":   F(c[0],1,4,3,8); F(c[1],0,10,2,2); break;
    case "wings":  F(c[0],0,3,3,2); F(c[0],1,5,3,3); F(c[1],0,8,2,2); break;

    case "critter":F(c[0],12,12,3,3); F(c[1],12,11,1,1); F(c[1],14,11,1,1); F("#1c1c2e",13,13,1,1); break;

const _gearCache = {};
function avatarGeared(name, equipped){
  equipped = equipped || {};
  const key = name + "|" + SLOTS.map(s=>equipped[s]||"").join(",");
  if(_gearCache[key]) return _gearCache[key];
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const x = c.getContext("2d");
  if(equipped.back) drawGearItem(x, equipped.back);
  const base = document.createElement("canvas"); base.width = 8; base.height = 8;
  _redrawBase(base.getContext("2d"), name);
  x.drawImage(base, 4, 4);
  if(equipped.head) drawGearItem(x, equipped.head);
  if(equipped.hand) drawGearItem(x, equipped.hand);
  if(equipped.comp) drawGearItem(x, equipped.comp);
  return (_gearCache[key] = c.toDataURL());
}
function _redrawBase(x, name){
  let h = 2166136261 >>> 0;
  for(const ch of String(name)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h = Math.imul(h ^ (h>>>15), 2246822519) >>> 0; h = Math.imul(h ^ (h>>>13), 3266489917) >>> 0; return ((h ^= h>>>16) >>> 0) / 4294967296; };
  const hue = Math.floor(rnd() * 360);
  const base = "hsl(" + hue + ",62%,52%)", acc = "hsl(" + ((hue + 150) % 360) + ",70%,58%)";
  for(let ry = 0; ry < 8; ry++) for(let rx = 0; rx < 4; rx++){
    const v = rnd();
    if(v > 0.52){ x.fillStyle = v > 0.86 ? acc : base; x.fillRect(rx, ry, 1, 1); x.fillRect(7 - rx, ry, 1, 1); }
  }
  x.fillStyle = base; x.fillRect(2, 2, 4, 3);
  x.fillStyle = "#191625"; x.fillRect(2, 3, 1, 1); x.fillRect(5, 3, 1, 1);
  if(rnd() > 0.5){ x.fillRect(3, 4, 2, 1); }
  x.fillStyle = base; x.fillRect(2, 7, 1, 1); x.fillRect(5, 7, 1, 1);
}
function gearImg(name, equipped, cls){
  return '<img class="avatarimg' + (cls ? " " + cls : "") + '" alt="" src="' + avatarGeared(name, equipped) + '">';
}
